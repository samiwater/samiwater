<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>SamiWater Landing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #000;
      height: 100%;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 600px;
      aspect-ratio: 9 / 16;
      margin: auto;
      background-image: url('samiwater-landing.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    .btn {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 65%;
      height: 9%;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 2;
    }

    /* دکمه‌ها */
    #start-btn {
      top: 49.3%; /* فقط همین یکی 1٪ بالاتر رفت */
    }

    #app-btn {
      top: 61.1%; /* دست‌نخورده چون دقیق بود */
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="btn" id="start-btn" onclick="location.href='request-check.html'"></button>
    <button class="btn" id="app-btn" onclick="location.href='main.html'"></button>
  </div>

<script>
// ===== آپدیت لوگوی تب و آیکون صفحه اصلی (logoasli.png) =====
(function () {
  const LOGO = "/logoasli.png";
  const OLD_LOGO = /logo-samiwater|samiwater[-_]logo|(^|\/)logo\.(png|jpe?g|svg|webp)(\?.*)?$/i;
  function fixLogos() {
    try {
      document.querySelectorAll("img").forEach(img => {
        const s = img.getAttribute("src") || "";
        if (s && !/logoasli\.png/i.test(s) && OLD_LOGO.test(s)) img.setAttribute("src", LOGO);
      });
      [["icon", "image/png"], ["apple-touch-icon", ""]].forEach(([rel, type]) => {
        let l = document.querySelector('link[rel~="' + rel + '"]');
        if (!l) { l = document.createElement("link"); l.rel = rel; document.head.appendChild(l); }
        if (type) l.type = type;
        if (l.getAttribute("href") !== LOGO) l.setAttribute("href", LOGO);
      });
    } catch (e) {}
  }
  fixLogos();
  window.addEventListener("load", fixLogos);
})();
</script>
  
<script>
(function(){
  if (window.innerWidth < 900) return;
  const st = document.createElement("style");
  st.textContent = "html,body{margin:0;padding:0;width:100%;height:100%;overflow-x:hidden;background:#090d16;} .sw-fs-stage{position:relative!important;height:100dvh!important;width:auto!important;max-width:100vw!important;margin:0 auto!important;box-shadow:0 0 60px rgba(0,0,0,.85);}";
  document.head.appendChild(st);
  const root = document.querySelector(".stage,.screen,.wrap,.app,.container,main,body > div");
  if (!root || root === document.body) return;
  const bg = getComputedStyle(root).backgroundImage || "";
  const m = bg.match(/url\(["']?([^"')]+)["']?\)/);
  const imgEl = root.querySelector("img");
  const src = m ? m[1] : (imgEl ? imgEl.src : "");
  if (src) {
    const im = new Image();
    im.onload = () => { if (im.naturalWidth && im.naturalHeight) { root.classList.add("sw-fs-stage"); root.style.aspectRatio = im.naturalWidth + " / " + im.naturalHeight; } };
    im.src = src;
  }
})();
</script>
</body>
</html>
