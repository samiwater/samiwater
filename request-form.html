### 💡 خلاصه نکات مشاوره‌ای و تغییراتی که توی این نسخه اعمال شده:

1. **تفکیک سوابق و تایمر بر اساس «عنوان آدرس» (نه متن آدرس):**
   چون دستگاه تصفیه آب به «زندگی مشتری» وصله نه به ملک، اگر مشتری اسباب‌کشی کنه و آدرسِ **«خونه»** رو تغییر بده، تمام سوابق سرویس‌ها و تایمر ۱۸۰ روزه‌ی **«خونه»** سر جاش باقی می‌مونه. هر عنوان آدرس (`خونه`، `محل کار`، `منزل پدر`) تایمر شمارش معکوس مستقل خودش رو داره و به محض اینکه وضعیت فاکتور رو توی پنل بذاری روی **«انجام شده»**، تایمرِ همون عنوان آدرس به صورت خودکار از امروز ریست و شارژ می‌شه.
2. **نوتیفیکیشن (پاپ‌آپ) هوشمند تایید آدرس برای مشتری قبلی:**
   وقتی مشتری شماره‌اش رو وارد می‌کنه، یه پنجره شیک باز می‌شه و می‌پرسه: *«درخواست شما برای آدرس «خونه» ثبت شود؟»* و زیرش هم دکمه **`➕ آدرس جدید با همین شماره`** داره تا اگر برای مغازه یا منزل پدرش سرویس می‌خواد، درجا اضافه کنه.
3. **فرم خلوت و سریع با دکمه `+` برای شماره دوم:**
   توی فرم ثبت‌نام، عنوان آدرس به صورت پیش‌فرض روی **`🏠 خونه`** انتخاب شده (با دکمه‌های آماده برای `محل کار`، `منزل پدر` و `مغازه`). کادر شماره تماس دوم هم مخفیه و فقط وقتی مشتری روی دکمه **`+ افزودن شماره تماس دوم`** بزنه باز می‌شه تا فرم شلوغ نشه.
4. **سطح دسترسی پرسنل (مدیر / پشتیبان / تکنسین) و ثبت ساعت ورود:**
   پنل مدیریت کامل فقط در اختیار مدیر ارشد (`admin`) هست و فقط مدیر می‌تونه فاکتور حذف کنه یا پرسنل تعریف کنه. کارمند پشتیبانی (`support`) به بانک اطلاعات و ویرایش دسترسی داره ولی اجازه حذف فاکتور نداره، و تکنسین (`technician`) هم فقط سرویس‌های خودش رو می‌بینه.
5. **احراز هویت پیامکی (فراز اس‌ام‌اس):**
   بلافاصله بعد از اینکه این ۶ تا فایل رو جایگزین کردی، اطلاعات پنل فراز اس‌ام‌اس رو در انتهای همین پیام بهم میدی تا کد تایید پیامکی رو هم برای مشتریان و هم برای ورود پرسنل فعال کنیم.

## 📦 بخش اول: ۳ فایل گیت‌هابِ بک‌اند (`samiwater-backend`)

### ۱. فایل `models/customer.js` (در پوشه `models`)
کل محتوای فایل **`models/customer.js`** رو پاک کن و این کد رو بذار جاش:

```javascript
import mongoose from "mongoose";

const customerSchema = new mongoose.Schema(
  {
    fullName: { type: String, required: true, trim: true },
    phone: { type: String, required: true, trim: true, index: true }, // شماره اصلی
    secondaryPhones: [{ type: String, trim: true }], // شماره‌های دوم و سوم
    addresses: [
      {
        label: { type: String, default: "خونه" }, // عنوان مکان (خونه، محل کار، منزل پدر و...)
        fullAddress: { type: String, required: true },
        serviceIntervalDays: { type: Number, default: 180 }, // تایمر اختصاصی این آدرس
        lastServiceDate: { type: Date, default: Date.now }, // مبنای شمارش معکوس تایمر این آدرس
        isActiveTimer: { type: Boolean, default: true }
      }
    ],
    serviceIntervalDays: { type: Number, default: 180 },
    isActiveTimer: { type: Boolean, default: true },
    notes: { type: String, default: "" }
  },
  { timestamps: true }
);

const Customer =
  mongoose.models.Customer || mongoose.model("Customer", customerSchema);

export default Customer;
