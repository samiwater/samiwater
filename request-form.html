<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ثبت مشخصات مشتری | SamiWater</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #0f3b2d;
      --gold: #d9b24c;
      --gold-strong: #f2c94c;
      --ring: #3e6b57;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--green);
      font-family: "Vazirmatn", Tahoma, sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: min(560px, 100%);
      background: linear-gradient(180deg, #0f3b2df5, #0a291ff5);
      border: 1px solid var(--ring);
      border-radius: 18px;
      padding: 26px 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .brand img {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--gold);
    }
    h2 {
      text-align: center;
      color: var(--gold-strong);
      margin: 0 0 18px 0;
      font-size: 21px;
    }
    label {
      display: block;
      margin: 12px 0 6px;
      color: #dfeee8;
      font-size: 13px;
      font-weight: 600;
    }
    .input {
      width: 100%;
      background: #08241b;
      border: 1px solid #2e5a48;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      padding: 12px 14px;
      outline: none;
      font-family: inherit;
    }
    .input:focus {
      border-color: var(--gold-strong);
    }
    .input[readonly] {
      opacity: 0.8;
      text-align: center;
      direction: ltr;
      font-weight: bold;
      color: var(--gold-strong);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 480px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    .btn {
      width: 100%;
      margin-top: 22px;
      background: linear-gradient(180deg, #e2c15a, #cc9f2a);
      color: #1b2d23;
      border: none;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .err-box {
      color: #ffb4b4;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      padding: 10px;
      border-radius: 10px;
      margin-top: 14px;
      font-size: 13px;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="/logo-samiwater.png" alt="SamiWater" />
    </div>
    <h2>ثبت مشخصات و آدرس خدمات</h2>
    
    <div class="grid-2">
      <div>
        <label>شماره موبایل اصلی</label>
        <input id="phone" class="input" readonly />
      </div>
      <div>
        <label>شماره تماس دوم / ثابت (اختیاری)</label>
        <input id="phone2" class="input" inputmode="numeric" style="direction:ltr; text-align:center;" placeholder="مثلاً 0913 یا 031" />
      </div>
    </div>
    
    <label>نام و نام‌خانوادگی *</label>
    <input id="fullName" class="input" placeholder="نام و نام‌خانوادگی خود را وارد کنید" />
    
    <label>نوع سرویس درخواستی</label>
    <select id="issueType" class="input">
      <option value="سرویس دوره‌ای و تعویض فیلتر">سرویس دوره‌ای و تعویض فیلتر</option>
      <option value="تعمیر و عیب‌یابی دستگاه">تعمیر و عیب‌یابی دستگاه</option>
      <option value="نصب و راه‌اندازی دستگاه">نصب و راه‌اندازی دستگاه</option>
      <option value="مشاوره و سایر خدمات">مشاوره و سایر خدمات</option>
    </select>

    <div class="grid-2">
      <div>
        <label>عنوان مکان (منزل / مغازه / دفتر)</label>
        <input id="addressLabel" class="input" value="آدرس ۱ (منزل)" placeholder="مثلاً: منزل یا کافه" />
      </div>
      <div>
        <label>توضیحات یا ساعت هماهنگی (اختیاری)</label>
        <input id="notes" class="input" placeholder="مثلاً: عصرها تماس بگیرید" />
      </div>
    </div>

    <label>آدرس دقیق *</label>
    <input id="address" class="input" placeholder="خیابان، کوچه، پلاک، واحد" />

    <button id="submitBtn" class="btn">ثبت نهایی و دریافت کد پیگیری</button>
    <div id="errBox" class="err-box"></div>
  </div>

  <script>
    const API = "https://samiwater-backend.onrender.com";
    const params = new URLSearchParams(location.search);
    const phone = params.get("phone") || "";
    const prefDate = params.get("pd") || "";
    const prefWindow = params.get("pw") || "";

    document.getElementById("phone").value = phone;

    if (prefWindow) {
      document.getElementById("notes").value = `زمان هماهنگی: ${prefDate} ساعت ${prefWindow}`;
    }

    document.getElementById("submitBtn").addEventListener("click", async () => {
      const fullName = document.getElementById("fullName").value.trim();
      const phone2 = document.getElementById("phone2").value.trim();
      const addressLabel = document.getElementById("addressLabel").value.trim() || "آدرس ۱ (منزل)";
      const address = document.getElementById("address").value.trim();
      const issueType = document.getElementById("issueType").value;
      const notes = document.getElementById("notes").value.trim();
      const errBox = document.getElementById("errBox");
      const btn = document.getElementById("submitBtn");

      errBox.style.display = "none";

      if (!fullName || !address) {
        errBox.textContent = "لطفاً نام و نام‌خانوادگی و آدرس دقیق را وارد کنید.";
        errBox.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "در حال ثبت درخواست...";

      try {
        // ۱. ثبت/بروزرسانی اطلاعات مشتری به همراه شماره دوم و عنوان آدرس
        await fetch(`${API}/api/customers`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            phone,
            fullName,
            address,
            addressLabel,
            secondaryPhones: phone2 ? [phone2] : [],
            notes
          })
        });

        // ۲. ثبت درخواست سرویس و دریافت کد فاکتور جلالی
        const res = await fetch(`${API}/api/requests`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            phone,
            fullName,
            address,
            issueType,
            notes
          })
        });

        const result = await res.json();

        if (res.ok) {
          const invoiceCode = result.request?.invoiceCode || result.invoiceCode || "SW-OK";
          location.href = `request-confirmed.html?code=${encodeURIComponent(invoiceCode)}`;
        } else {
          errBox.textContent = result.error || "خطا در ثبت اطلاعات در سرور";
          errBox.style.display = "block";
        }
      } catch (e) {
        errBox.textContent = "خطا در ارتباط با سرور. لطفاً اینترنت خود را بررسی کنید.";
        errBox.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "ثبت نهایی و دریافت کد پیگیری";
      }
    });
  </script>
</body>
</html>
