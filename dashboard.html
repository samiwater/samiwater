<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل جامع مدیریت سامی‌واتر</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,sans-serif}
body{background:#0f172a;color:#1e293b;padding:8px}
.wrap{width:100%;max-width:1440px;margin:0 auto}
.hdr{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:14px;border-radius:14px;border:2px solid #d9b24c;margin-bottom:10px}
.hdr-t{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ham-btn{background:linear-gradient(135deg,#0284c7,#0369a1);color:#fff;border:2px solid #7dd3fc;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:bold;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 4px 12px #0006}
.ham-drawer{display:none;background:#0f172a;border:2px solid #38bdf8;border-radius:12px;padding:10px;margin-top:10px;grid-template-columns:1fr;gap:7px}
.ham-drawer.open{display:grid}
@media(min-width:768px){.ham-drawer.open{grid-template-columns:repeat(3,1fr)}}
.n-btn{background:#1e293b;color:#f8fafc;border:1px solid #475569;padding:11px 12px;border-radius:9px;font-size:12px;font-weight:bold;cursor:pointer;text-align:right;display:flex;justify-content:space-between;align-items:center}
.n-btn.active{background:#0284c7;color:#fff;border-color:#bae6fd}
.pill{background:#09261d;color:#facc15;border:1px solid #d9b24c;padding:5px 10px;border-radius:14px;font-size:11px;font-weight:bold;text-decoration:none;cursor:pointer}
.panel{display:none;background:#f1f5f9;border-radius:14px;padding:12px;border:2px solid #cbd5e1;margin-bottom:12px}
.panel.open{display:block}
.card{background:#fff;border:1.5px solid #cbd5e1;border-radius:11px;padding:10px;margin-bottom:8px}
.drw{background:#fff;border:1.5px solid #cbd5e1;border-radius:11px;margin-bottom:8px;overflow:hidden}
.drw-h{padding:10px 12px;background:#f8fafc;cursor:pointer;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;font-weight:bold}
.drw-b{display:none;padding:12px;border-top:1px solid #cbd5e1;background:#fff;font-size:12px;line-height:1.9}
.drw-b.open{display:block}
.grid2{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.inp{width:100%;padding:7px 9px;border:1.5px solid #94a3b8;border-radius:7px;font-size:12px;margin-bottom:6px;font-family:inherit}
.btn{background:#0f3b2d;color:#f5e6b8;border:1px solid #d9b24c;padding:7px 11px;border-radius:7px;cursor:pointer;font-size:11px;font-weight:bold}
table{width:100%;border-collapse:collapse;background:#fff;margin-top:6px}
th,td{border:1px solid #cbd5e1;padding:6px;text-align:right;font-size:11px;vertical-align:middle}
th{background:#f1f5f9;white-space:nowrap}
.bdg{padding:3px 7px;border-radius:5px;font-size:10px;font-weight:bold;display:inline-block}
.st-d{background:#dcfce7;color:#15803d}.st-al{background:#fee2e2;color:#dc2626}.st-p{background:#fef3c7;color:#b45309}.st-a{background:#e0f2fe;color:#0369a1}
.perm-chk{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #94a3b8;padding:7px 10px;border-radius:8px;font-size:11px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="hdr-t">
      <button class="ham-btn" onclick="$('hamNav').classList.toggle('open')">☰ منوی بخش‌های مدیریت (<span id="curTabTitle">خدمات جاری</span>)</button>
      <h1 style="font-size:15px;color:#38bdf8">💧 پنل جامع مدیریت سامی‌واتر</h1>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        <button class="pill" onclick="loadDash()">🔄 بروزرسانی</button>
        <a id="btnAccLink" href="accounting.html" class="pill" style="color:#fde047;border-color:#fde047">📊 نرم‌افزار حسابداری</a>
        <a id="btnTechLink" href="tech.html" class="pill" style="color:#4ade80;border-color:#4ade80">📱 پنل تکنسین</a>
        <span id="uBadge" class="pill">👑 مدیر ارشد</span>
        <button class="pill" style="background:#dc2626;color:#fff;border:none" onclick="localStorage.removeItem('token');location.href='login.html'">🚪 خروج</button>
      </div>
    </div>
    <div id="hamNav" class="ham-drawer">
      <button class="n-btn active" data-tab="p-orders" onclick="swTab('p-orders',this,'خدمات جاری')"><span>📋 ۱. خدمات جاری و ثبت سرویس</span><span id="cntOrd" class="bdg st-a">0</span></button>
      <button class="n-btn" data-tab="p-techs" onclick="swTab('p-techs',this,'کارتابل تکنسین‌ها')"><span>👨‍🔧 ۲. کارتابل و رصد تکنسین‌ها</span><span id="cntTech" class="bdg st-a">0</span></button>
      <button class="n-btn" data-tab="p-susp" onclick="swTab('p-susp',this,'تعلیقی تکنسین')"><span>⏸️ ۳. تعلیقی تکنسین</span><span id="cntSusp" class="bdg st-p">0</span></button>
      <button class="n-btn" data-tab="p-rem" onclick="swTab('p-rem',this,'یادآور سرویس')"><span>🔔 ۴. یادآور سرویس (زیر ۲۰ روز)</span><span id="cntRem" class="bdg st-al">0</span></button>
      <button class="n-btn" data-tab="p-wh" onclick="swTab('p-wh',this,'انبار مرکزی و حواله')"><span>🏭 ۵. انبار مرکزی و حواله</span><span>◀</span></button>
      <button class="n-btn" data-tab="p-cust" onclick="swTab('p-cust',this,'بانک اطلاعات و مناطق')"><span>👥 ۶. بانک اطلاعات، تیکت و مناطق</span><span>◀</span></button>
      <button class="n-btn" data-tab="p-arch" onclick="swTab('p-arch',this,'بایگانی خدمات')"><span>🗂️ ۷. بایگانی کل خدمات</span><span>◀</span></button>
      <button class="n-btn" data-tab="p-trash" onclick="swTab('p-trash',this,'فاکتورهای حذفی')"><span>🗑️ ۸. فاکتورهای حذفی</span><span id="cntTr" class="bdg st-al">0</span></button>
      <button class="n-btn" data-tab="p-cat" onclick="swTab('p-cat',this,'تعرفه کالا و دستمزد')"><span>🏷️ ۹. تعرفه کالا و دستمزد</span><span>◀</span></button>
      <button class="n-btn" data-tab="p-users" onclick="swTab('p-users',this,'خلق کاربران و دسترسی')"><span>🔐 ۱۰. خلق کاربران و تعیین دسترسی</span><span>◀</span></button>
    </div>
  </div>
  <div id="p-orders" class="panel open"></div>
  <div id="p-techs" class="panel"></div>
  <div id="p-susp" class="panel"></div>
  <div id="p-rem" class="panel"></div>
  <div id="p-wh" class="panel"></div>
  <div id="p-cust" class="panel"></div>
  <div id="p-arch" class="panel"></div>
  <div id="p-trash" class="panel"></div>
  <div id="p-cat" class="panel"></div>
  <div id="p-users" class="panel"></div>
</div>
<!-- PART 1 END -->
  <script>
const API = "https://samiwater-backend.onrender.com/api";
const $ = id => document.getElementById(id);
const num = v => Math.round(Number(String(v || 0).replace(/,/g, "")) || 0);
const fmt = n => num(n).toLocaleString("fa-IR");
function onMoneyInp(el) {
  let raw = String(el.value || "").replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[^0-9]/g, "");
  el.value = raw ? Number(raw).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",") : "";
}
function toJ(d, withTime) {
  if (!d) return "---";
  try {
    const dt = new Date(d);
    let s = new Intl.DateTimeFormat("fa-IR", { year: "numeric", month: "2-digit", day: "2-digit" }).format(dt);
    if (withTime) s += " ساعت " + new Intl.DateTimeFormat("fa-IR", { hour: "2-digit", minute: "2-digit", hour12: false }).format(dt);
    ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"].forEach((p, i) => s = s.replace(new RegExp(p, "g"), i));
    return s;
  } catch (e) { return "---"; }
}
function normPh(p) { return String(p || "").replace(/\D/g, "").slice(-10); }

const ISF_REGIONS = ["ملاصدرا","توحید","هشت بهشت","نشاط","شاهزید","سیچان","نظر","چهارباغ","بزرگمهر","پروین","کاوه","خانه اصفهان","مرداویج","شیخ صدوق","جی","باهنر","رباط","سجاد","آبشار","مشتاق","لنبان","وحید","خاقانی","محتشم","شمس آبادی","عباس آباد","رودکی","آتشگاه","بهارستان","سپاهان شهر","شاهین شهر","نجف آباد","خمینی شهر","گز"];
function detectRegion(addr, savedReg) {
  if (savedReg) return savedReg;
  const a = String(addr || "");
  for (const r of ISF_REGIONS) { if (a.includes(r)) return r; }
  return "سایر مناطق";
}

if (!localStorage.getItem("token")) location.href = "login.html";
const uRole = localStorage.getItem("role") || "admin", uName = localStorage.getItem("username") || "مدیر";
let reqs = [], settings = {}, techs = JSON.parse(localStorage.getItem("sw_techs") || '["مهندس شهریاری"]');
let selTechFilter = "ALL", techSubTab = "todo", openOrdId = "", openTechOrdId = "";

const ROLE_POOL = {
  support: { label: "🎧 نیروی پشتیبانی خدمات", tabs: [["p-orders","📋 خدمات جاری و ثبت سرویس"],["p-techs","👨‍🔧 رصد کارتابل تکنسین‌ها"],["p-susp","⏸️ تعلیقی تکنسین"],["p-rem","🔔 یادآور سرویس"],["p-cust","👥 بانک اطلاعات و مناطق"],["p-arch","🗂️ بایگانی خدمات"],["p-trash","🗑️ فاکتورهای حذفی"]] },
  callcenter: { label: "📞 کال‌سنتر یادآور", tabs: [["p-rem","🔔 یادآور سرویس"],["p-susp","⏸️ تعلیقی تکنسین"],["p-cust","👥 بانک اطلاعات مشتریان"],["p-orders","📋 ثبت سفارش جدید"]] },
  warehouse: { label: "🏭 انباردار", tabs: [["p-wh","🏭 انبار مرکزی و حواله"],["p-techs","👨‍🔧 موجودی انبار تکنسین‌ها"]] },
  supervisor: { label: "🛡️ سرپرست عملیات", tabs: [["p-orders","📋 خدمات جاری"],["p-techs","👨‍🔧 کارتابل تکنسین‌ها"],["p-susp","⏸️ تعلیقی‌ها"],["p-rem","🔔 یادآور سرویس"],["p-wh","🏭 انبار مرکزی"],["p-cust","👥 بانک مشتریان"],["p-arch","🗂️ بایگانی خدمات"],["p-trash","🗑️ فاکتورهای حذفی"]] },
  accountant: { label: "📊 حسابدار", tabs: [["ACCOUNTING","📊 نرم‌افزار تخصصی حسابداری"],["p-arch","🗂️ مشاهده بایگانی فاکتورها"]] },
  tech: { label: "👨‍🔧 تکنسین فنی", tabs: [["TECH_PANEL","📱 کارتابل و انبار سیار تکنسین"]] }
};

function applyUserPermissions() {
  const staff = (settings.staffUsers || []).find(u => u.username === uName);
  if (staff && staff.locked) { alert("🔒 دسترسی حساب شما توسط مدیریت قفل شده است."); localStorage.removeItem("token"); location.href = "login.html"; return; }
  if (uRole === "tech") { location.href = "tech.html"; return; }
  if (uRole === "accountant" && (!staff || !(staff.allowedTabs || []).includes("p-arch"))) { location.href = "accounting.html"; return; }
  $("uBadge").textContent = (uRole === "admin" ? "👑 مدیر ارشد (" : (ROLE_POOL[uRole]?.label || "کاربر") + " (") + uName + ")";
  if (uRole !== "admin") {
    const allowed = staff?.allowedTabs || (ROLE_POOL[uRole]?.tabs || []).map(x => x[0]);
    if (!allowed.includes("ACCOUNTING")) $("btnAccLink").style.display = "none";
    $("btnTechLink").style.display = "none";
    let firstBtn = null;
    document.querySelectorAll("#hamNav .n-btn").forEach(btn => {
      const t = btn.getAttribute("data-tab");
      if (allowed.includes(t)) { btn.style.display = "flex"; if (!firstBtn) firstBtn = btn; }
      else btn.style.display = "none";
    });
    const curAct = document.querySelector("#hamNav .n-btn.active");
    if (curAct && curAct.style.display === "none" && firstBtn) firstBtn.click();
  }
}

function swTab(id, btn, title) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("open"));
  document.querySelectorAll(".n-btn").forEach(b => b.classList.remove("active"));
  if ($(id))$(id).classList.add("open");
  if (btn) btn.classList.add("active");
  if (title) $("curTabTitle").textContent = title;
  $("hamNav").classList.remove("open");
}

async function loadDash() {
  const [r1, r2] = await Promise.all([fetch(API + "/requests"), fetch(API + "/requests/settings")]);
  if (r1.ok) reqs = (await r1.json()).requests || [];
  if (r2.ok) settings = (await r2.json()).settings || {};
  Object.keys(settings.techMeta || {}).forEach(t => { if (!techs.includes(t)) techs.push(t); });
  reqs.forEach(r => { if (r.technicianName && !techs.includes(r.technicianName)) techs.push(r.technicianName); });
  applyUserPermissions();
  renderOrdersPanel(); renderTechsPanel(); renderSuspPanel(); renderRemPanel();
  renderWhPanel(); renderCustPanel(); renderArchPanel(); renderTrashPanel();
  renderCatPanel(); renderUsersPanel();
}

function getCustPastInfo(phone, name, excludeId) {
  const cPh = normPh(phone);
  const past = reqs.filter(x => x._id !== excludeId && ((cPh && normPh(x.snapshot?.phone) === cPh) || (name && x.snapshot?.fullName === name)));
  const addrs = [...new Set(past.map(x => x.snapshot?.address).filter(Boolean))];
  const tickets = (settings.customerTickets || []).filter(tk => (cPh && normPh(tk.phone) === cPh) || (name && tk.customerName === name));
  return { past, addrs, tickets };
}

function renderOrdersPanel() {
  const active = reqs.filter(r => r.status === "pending" || r.status === "assigned" || r.status === "in_progress");
  $("cntOrd").textContent = active.length;
  const tOpts = techs.map(t => '<option value="' + t + '">' + t + '</option>').join("");
  $("p-orders").innerHTML =
    '<div class="card" style="background:#eff6ff;border-color:#93c5fd">' +
      '<b style="font-size:12px;color:#1e40af;display:block;margin-bottom:6px">➕ ثبت درخواست سرویس جدید و ارجاع به تکنسین:</b>' +
      '<div class="grid2">' +
        '<div><input id="nName" class="inp" placeholder="نام و نام خانوادگی مشتری *"><input id="nPh" class="inp" style="direction:ltr" placeholder="شماره موبایل مشتری *"></div>' +
        '<div><input id="nAddr" class="inp" placeholder="آدرس دقیق مشتری *"><div style="display:flex;gap:5px"><input id="nIss" class="inp" style="margin:0;flex:2" placeholder="علت سرویس / توضیحات برای تکنسین"><select id="nTech" class="inp" style="margin:0;flex:1"><option value="">انتخاب تکنسین...</option>' + tOpts + '</select></div></div>' +
      '</div><button class="btn" style="width:100%;background:#0284c7;color:#fff;margin-top:6px;padding:9px" onclick="createNewOrder()">💾 ثبت سرویس و ارسال به کارتابل</button>' +
    '</div>' +
    (active.length ? active.map(r => {
      const cust = r.snapshot?.fullName || "مشتری", ph = r.snapshot?.phone || "", addr = r.snapshot?.address || "---";
      const info = getCustPastInfo(ph, cust, r._id), isOp = openOrdId === r._id;
      return '<div class="drw">' +
        '<div class="drw-h" onclick="openOrdId=(openOrdId===\'' + r._id + '\'?\'\':\'' + r._id + '\');renderOrdersPanel()">' +
          '<div>👤 <b>' + cust + '</b> (' + ph + ') <span class="bdg st-a">' + (r.invoiceCode || "---") + '</span> ' + (r.technicianName ? '<span class="bdg st-d">👨‍🔧 ' + r.technicianName + '</span>' : '<span class="bdg st-al">⏳ بدون تکنسین</span>') + '</div>' +
          '<div style="font-size:11px;color:#475569">🕒 ثبت: ' + toJ(r.createdAt, true) + ' | باز کردن جزئیات ▾</div>' +
        '</div>' +
        '<div class="drw-b ' + (isOp ? 'open' : '') + '">' +
          '<div>📍 <b>آدرس فعلی:</b> ' + addr + ' <span class="bdg st-p">' + detectRegion(addr) + '</span></div>' +
          (info.addrs.length > 1 ? '<div>🏠 <b>سایر آدرس‌های ثبت‌شده قبلی این مشتری:</b> ' + info.addrs.join(" | ") + '</div>' : '') +
          '<div>🔧 <b>شرح درخواست و توضیحات:</b> ' + (r.issueType || "سرویس دوره‌ای") + ' | 📞 <b>تلفن:</b> <a href="tel:' + ph + '" style="font-weight:bold;color:#0284c7">' + ph + '</a></div>' +
          '<div>📜 <b>سابقه قبلی مشتری:</b> ' + info.past.length + ' سرویس قبلی ' + (info.past[0] ? '(آخرین سرویس: ' + toJ(info.past[0].completedAt || info.past[0].createdAt) + ' — ' + (info.past[0].workReport || "انجام شد") + ')' : '') + '</div>' +
          (info.tickets.length ? '<div style="background:#fff1f2;padding:6px;border-radius:6px;color:#be123c">🎫 <b>تیکت‌های قبلی مشتری:</b> ' + info.tickets.map(t => t.date + ': [' + t.tag + '] ' + t.note).join(" | ") + '</div>' : '') +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed #cbd5e1">' +
            '<select class="inp" style="margin:0;width:160px" onchange="assignTech(\'' + r._id + '\',this.value)"><option value="">تغییر/ارجاع تکنسین...</option>' + techs.map(t => '<option value="' + t + '" ' + (r.technicianName === t ? 'selected' : '') + '>' + t + '</option>').join("") + '</select>' +
            '<button class="btn" style="background:#16a34a;color:#fff" onclick="sendOrderSms(\'' + r._id + '\',\'' + ph + '\',\'' + cust + '\',\'' + (r.technicianName || "") + '\')">📲 پیامک به مشتری ' + (r.smsSentAt ? '(✅ ارسال‌شده در ' + r.smsSentAt + ')' : '') + '</button>' +
            '<button class="btn" style="background:#0284c7;color:#fff" onclick="editOrderNote(\'' + r._id + '\')">✏️ ویرایش آدرس/توضیح</button>' +
            '<button class="btn" style="background:#ef4444;color:#fff" onclick="moveTrash(\'' + r._id + '\')">🗑️ حذف</button>' +
          '</div>' +
        '</div></div>';
    }).join("") : '<div class="card">سرویس فعالی در جریان نیست.</div>');
}
// PART 2 END
    async function createNewOrder() {
  const fullName = $("nName").value.trim(), phone = $("nPh").value.trim(), address = $("nAddr").value.trim(), issueType = $("nIss").value.trim() || "سرویس دوره‌ای", tech = $("nTech").value;
  if (!fullName || !phone) return alert("نام و موبایل مشتری الزامی است.");
  const r = await fetch(API + "/requests", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fullName, phone, address, issueType }) });
  if (r.ok && tech) { const d = await r.json(); if (d.request?._id) await assignTech(d.request._id, tech); }
  await loadDash();
}
async function assignTech(id, techName) {
  await fetch(API + "/requests/" + id + "/status", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: techName ? "assigned" : "pending", technicianName: techName }) });
  await loadDash();
}
async function sendOrderSms(id, ph, cust, tech) {
  const tm = toJ(new Date(), true);
  await fetch(API + "/requests/" + id + "/status", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ smsSentAt: tm }) });
  location.href = "sms:" + ph + "?body=" + encodeURIComponent(`مشتری گرامی ${cust}، درخواست سرویس تصفیه آب شما در سامی‌واتر ثبت و به تکنسین (${tech || "فنی"}) ارجاع شد.`);
  setTimeout(loadDash, 800);
}
async function editOrderNote(id) {
  const r = reqs.find(x => x._id === id); if (!r) return;
  const nIss = prompt("ویرایش توضیحات / یادداشت برای تکنسین:", r.issueType || ""); if (nIss === null) return;
  await fetch(API + "/requests/" + id + "/status", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ issueType: nIss }) });
  await loadDash();
}
async function moveTrash(id) {
  const rsn = prompt("علت حذف فاکتور:"); if (!rsn) return;
  await fetch(API + "/requests/" + id + "/status", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: "trashed", deleteReason: rsn }) });
  await loadDash();
}

function renderTechsPanel() {

  $("p-users").innerHTML =
    '<div class="card">' +
      '<b style="font-size:13px;color:#0f3b2d;display:block;margin-bottom:8px">🔐 خلق کاربر جدید با انتخاب دستیِ بخش‌های مجاز (فقط گزینه‌های مرتبط با همان نقش نمایش داده می‌شوند):</b>' +
      '<div class="grid2">' +
        '<div><label style="font-size:11px;font-weight:bold">۱. انتخاب نوع کاربر (نقش):</label><select id="uRoleSel" class="inp" onchange="renderRoleCheckboxes()">' + Object.keys(ROLE_POOL).map(k => '<option value="' + k + '">' + ROLE_POOL[k].label + '</option>').join("") + '</select>' +
        '<input id="uFullName" class="inp" placeholder="نام و نام خانوادگی شخص *"><input id="uPhone" class="inp" style="direction:ltr" placeholder="شماره موبایل"></div>' +
        '<div><label style="font-size:11px;font-weight:bold">۲. نام کاربری و رمز عبور ورود:</label><div style="display:flex;gap:5px"><input id="uUser" class="inp" style="direction:ltr" placeholder="نام کاربری"><input id="uPass" class="inp" style="direction:ltr" placeholder="رمز عبور"></div>' +
        '<button class="btn" style="width:100%;background:#0284c7;color:#fff;margin-bottom:6px" onclick="genAutoCreds()">🎲 تولید خودکار نام کاربری و رمز</button></div>' +
      '</div>' +
      '<div style="background:#eff6ff;border:1.5px solid #93c5fd;padding:10px;border-radius:10px;margin:6px 0">' +
        '<b style="font-size:12px;color:#1e40af;display:block;margin-bottom:6px">☑️ ۳. دسترسی به کدام بخش‌ها برای این شخص مجاز است؟ (دستی تیک بزنید یا بردارید):</b>' +
        '<div id="roleChkContainer" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px"></div>' +
      '</div>' +
      '<button class="btn" style="width:100%;background:#16a34a;color:#fff;padding:10px;font-size:12px" onclick="createStaffRoleUser()">✅ ثبت کاربر با دسترسی‌های انتخاب‌شده</button>' +
      '<div style="overflow-x:auto;margin-top:10px"><table><thead><tr><th>نام شخص</th><th>نقش</th><th>بخش‌های مجاز انتخاب‌شده</th><th>نام کاربری</th><th>رمز</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>' +
      users.map((u, i) => {
        const pool = ROLE_POOL[u.role]?.tabs || [];
        const allowedNames = (u.allowedTabs || []).map(k => (pool.find(x => x[0] === k) || [k, k])[1]).join(" ، ") || "بدون دسترسی";
        return '<tr><td><b>' + u.fullName + '</b></td><td>' + (ROLE_POOL[u.role]?.label || u.role) + '</td><td style="font-size:10px;color:#0369a1">' + allowedNames + '</td><td style="direction:ltr"><b>' + u.username + '</b></td><td style="direction:ltr">' + u.password + '</td><td>' + (u.locked ? '<span class="bdg st-al">🔒 قفل</span>' : '<span class="bdg st-d">🟢 فعال</span>') + '</td><td style="display:flex;gap:4px;flex-wrap:wrap"><button class="btn" style="background:#0284c7;color:#fff;padding:3px 7px" onclick="editUserPerms(' + i + ')">⚙️ ویرایش دسترسی</button><button class="btn" style="background:' + (u.locked ? '#16a34a' : '#d97706') + ';color:#fff;padding:3px 7px" onclick="togStaffLock(' + i + ')">' + (u.locked ? '🔓 باز کردن' : '🔒 قفل') + '</button><button class="btn" style="background:#ef4444;color:#fff;padding:3px 7px" onclick="delStaffUser(' + i + ')">🗑️</button></td></tr>';
      }).join("") + '</tbody></table></div></div>';
  renderRoleCheckboxes();
}
function genAutoCreds() {
  const r = $("uRoleSel").value;
  $("uUser").value = r + "_" + Math.floor(100 + Math.random() * 900);
  $("uPass").value = String(Math.floor(100000 + Math.random() * 900000));
}
async function createStaffRoleUser() {
  const role = $("uRoleSel").value, fullName = $("uFullName").value.trim(), phone = $("uPhone").value.trim();
  if (!fullName) return alert("نام شخص را وارد کنید.");
  const allowedTabs = [...document.querySelectorAll(".u-perm-box:checked")].map(el => el.value);
  if (!allowedTabs.length) return alert("حداقل یک بخش مجاز را برای این کاربر تیک بزنید.");
  if (!$("uUser").value.trim() || !$("uPass").value.trim()) genAutoCreds();
  const username = $("uUser").value.trim(), password = $("uPass").value.trim();
  const users = settings.staffUsers || [], tm = settings.techMeta || {};
  users.unshift({ id: "usr_" + Date.now(), role, fullName, phone, username, password, allowedTabs, locked: false });
  if (role === "tech") {
    if (!techs.includes(fullName)) { techs.push(fullName); localStorage.setItem("sw_techs", JSON.stringify(techs)); }
    tm[fullName] = { ...(tm[fullName] || {}), phone, username, password, locked: false };
  }
  await fetch(API + "/requests/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ staffUsers: users, techMeta: tm }) });
  await loadDash(); alert(`✅ کاربر «${fullName}» ساخته شد.\nنام کاربری: ${username}\nرمز: ${password}`);
}
async function editUserPerms(i) {
  const users = settings.staffUsers || [], u = users[i]; if (!u) return;
  const pool = ROLE_POOL[u.role]?.tabs || [];
  const newAllowed = [];
  for (const item of pool) {
    const hasNow = (u.allowedTabs || []).includes(item[0]);
    if (confirm(`آیا «${u.fullName}» به بخش «${item[1]}» دسترسی داشته باشد؟\n(وضعیت فعلی: ${hasNow ? "دارد ✅" : "ندارد ❌"})\n\nOK = بله، دسترسی داشته باشد\nCancel = خیر، بسته شود`)) newAllowed.push(item[0]);
  }
  u.allowedTabs = newAllowed;
  await fetch(API + "/requests/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ staffUsers: users }) });
  await loadDash();
}
async function togStaffLock(i) {
  const users = settings.staffUsers || [], u = users[i]; if (!u) return; u.locked = !u.locked;
  const tm = settings.techMeta || {}; if (u.role === "tech" && tm[u.fullName]) tm[u.fullName].locked = u.locked;
  await fetch(API + "/requests/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ staffUsers: users, techMeta: tm }) }); await loadDash();
}
async function delStaffUser(i) {
  if (!confirm("حذف شود؟")) return;
  const users = settings.staffUsers || []; users.splice(i, 1);
  await fetch(API + "/requests/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ staffUsers: users }) }); await loadDash();
}
loadDash();
</script>
</body>
