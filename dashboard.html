<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل جامع مدیریت خدمات | سامی‌واتر</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,sans-serif}
body{background:#0f172a;color:#1e293b;padding:8px}
.wrap{width:100%;max-width:1440px;margin:0 auto}
.hdr{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;padding:14px;border-radius:14px;border:2px solid #d9b24c;margin-bottom:10px}
.hdr-t{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.pill{background:#09261d;color:#facc15;border:1px solid #d9b24c;padding:5px 10px;border-radius:14px;font-size:11px;font-weight:bold;text-decoration:none;cursor:pointer}
.nav-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
@media(min-width:900px){.nav-grid{grid-template-columns:repeat(5,1fr)}}
.n-btn{background:#1e293b;color:#f8fafc;border:1px solid #475569;padding:10px 8px;border-radius:10px;font-size:11px;font-weight:bold;cursor:pointer;text-align:center}
.n-btn.active{background:#0284c7;color:#fff;border-color:#7dd3fc;box-shadow:0 3px 10px #0284c755}
.panel{display:none;background:#f8fafc;border-radius:14px;padding:12px;border:2px solid #cbd5e1;margin-bottom:12px}
.panel.open{display:block}
.card{background:#fff;border:1.5px solid #cbd5e1;border-radius:10px;padding:10px;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.inp{width:100%;padding:7px 9px;border:1.5px solid #94a3b8;border-radius:7px;font-size:12px;margin-bottom:6px;font-family:inherit}
.btn{background:#0f3b2d;color:#f5e6b8;border:1px solid #d9b24c;padding:7px 11px;border-radius:7px;cursor:pointer;font-size:11px;font-weight:bold}
table{width:100%;border-collapse:collapse;background:#fff;margin-top:6px}
th,td{border:1px solid #cbd5e1;padding:6px;text-align:right;font-size:11px;vertical-align:middle}
th{background:#f1f5f9;white-space:nowrap}
.bdg{padding:3px 7px;border-radius:5px;font-size:10px;font-weight:bold;display:inline-block}
.st-d{background:#dcfce7;color:#15803d}.st-al{background:#fee2e2;color:#dc2626}.st-p{background:#fef3c7;color:#b45309}.st-a{background:#e0f2fe;color:#0369a1}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="hdr-t">
      <h1 style="font-size:15px;color:#38bdf8">💧 پنل جامع مدیریت عملیات و خدمات سامی‌واتر</h1>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        <button class="pill" onclick="loadDash()">🔄 بروزرسانی</button>
        <a id="btnAccLink" href="accounting.html" class="pill" style="color:#fde047;border-color:#fde047">📊 نرم‌افزار حسابداری</a>
        <a id="btnTechLink" href="tech.html" class="pill" style="color:#4ade80;border-color:#4ade80">📱 پنل تکنسین</a>
        <span id="uBadge" class="pill">👑 مدیر</span>
        <button class="pill" style="background:#dc2626;color:#fff;border:none" onclick="localStorage.removeItem('token');location.href='login.html'">🚪 خروج</button>
      </div>
    </div>
    <div class="nav-grid" id="mainNav">
      <button class="n-btn active" data-roles="admin,supervisor,support" onclick="swTab('p-orders',this)">📋 خدمات جاری (<span id="cntOrd">0</span>)</button>
      <button class="n-btn" data-roles="admin,supervisor,support,callcenter" onclick="swTab('p-susp',this)">⏸️ تعلیقی تکنسین (<span id="cntSusp">0</span>)</button>
      <button class="n-btn" data-roles="admin,supervisor,support,callcenter" onclick="swTab('p-rem',this)">🔔 یادآور سرویس (<span id="cntRem">0</span>)</button>
      <button class="n-btn" data-roles="admin,supervisor,support" onclick="swTab('p-techs',this)">👨‍🔧 کارتابل تکنسین‌ها (<span id="cntTech">0</span>)</button>
      <button class="n-btn" data-roles="admin,supervisor,warehouse" onclick="swTab('p-wh',this)">🏭 انبار مرکزی و حواله</button>
      <button class="n-btn" data-roles="admin,supervisor,support,callcenter" onclick="swTab('p-cust',this)">👥 بانک اطلاعات و مناطق</button>
      <button class="n-btn" data-roles="admin,supervisor,support" onclick="swTab('p-arch',this)">🗂️ بایگانی خدمات</button>
      <button class="n-btn" data-roles="admin,supervisor" onclick="swTab('p-trash',this)">🗑️ فاکتورهای حذفی (<span id="cntTr">0</span>)</button>
      <button class="n-btn" data-roles="admin" onclick="swTab('p-cat',this)">🏷️ تعرفه کالا و دستمزد</button>
      <button class="n-btn" data-roles="admin" onclick="swTab('p-users',this)">🔐 خلق کاربران و دسترسی</button>
    </div>
  </div>

  <div id="p-orders" class="panel open"></div>
  <div id="p-susp" class="panel"></div>
  <div id="p-rem" class="panel"></div>
  <div id="p-techs" class="panel"></div>
  <div id="p-wh" class="panel"></div>
  <div id="p-cust" class="panel"></div>
  <div id="p-arch" class="panel"></div>
  <div id="p-trash" class="panel"></div>
  <div id="p-cat" class="panel"></div>
  <div id="p-users" class="panel"></div>
</div>
<!-- PART 1 END -->
  <script>
const API = "https://samiwater-backend.onrender.com/api";
const $ = id => document.getElementById(id);
const num = v => Math.round(Number(String(v || 0).replace(/,/g, "")) || 0);
const fmt = n => num(n).toLocaleString("fa-IR");
const fmtM = n => num(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
function onMoneyInp(el) {
  let raw = String(el.value || "").replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[^0-9]/g, "");
  el.value = raw ? Number(raw).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",") : "";
}
function toJ(d) {
  if (!d) return "---";
  try {
    let s = new Intl.DateTimeFormat("fa-IR", { year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(d));
    ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"].forEach((p, i) => s = s.replace(new RegExp(p, "g"), i));
    return s;
  } catch (e) { return "---"; }
}
function normPh(p) { return String(p || "").replace(/\D/g, "").slice(-10); }

const ISF_REGIONS = ["ملاصدرا","توحید","هشت بهشت","نشاط","شاهزید","سیچان","نظر","چهارباغ","بزرگمهر","پروین","کاوه","خانه اصفهان","مرداویج","شیخ صدوق","جی","باهنر","رباط","سجاد","آبشار","مشتاق","لنبان","وحید","خاقانی","محتشم","شمس آبادی","عباس آباد","رودکی","آتشگاه","بهارستان","سپاهان شهر","شاهین شهر","نجف آباد","خمینی شهر","گز"];
function detectRegion(addr, savedReg) {
  if (savedReg) return savedReg;
  const a = String(addr || "");
  for (const r of ISF_REGIONS) { if (a.includes(r)) return r; }
  return "سایر مناطق";
}

if (!localStorage.getItem("token")) location.href = "login.html";
const uRole = localStorage.getItem("role") || "admin", uName = localStorage.getItem("username") || "مدیر";
if (uRole === "tech") location.href = "tech.html";
if (uRole === "accountant") location.href = "accounting.html";

let reqs = [], settings = {}, techs = JSON.parse(localStorage.getItem("sw_techs") || '["مهندس شهریاری"]'), selTechFilter = "ALL", techSubTab = "todo";

function applyRoleAccess() {
  const staff = (settings.staffUsers || []).find(u => u.username === uName);
  if (staff && staff.locked) { alert("🔒 حساب کاربری شما توسط مدیریت قفل شده است."); localStorage.removeItem("token"); location.href = "login.html"; return; }
  const roleNames = { admin: "👑 مدیر ارشد", supervisor: "🛡️ سرپرست", support: "🎧 پشتیبانی خدمات", warehouse: "🏭 انباردار", callcenter: "📞 کال‌سنتر یادآور" };
  $("uBadge").textContent = (roleNames[uRole] || "کاربر") + " (" + uName + ")";
  if (uRole !== "admin") $("btnAccLink").style.display = "none";
  if (uRole !== "admin" && uRole !== "supervisor") $("btnTechLink").style.display = "none";
  let firstAllowedBtn = null;
  document.querySelectorAll("#mainNav .n-btn").forEach(btn => {
    const allowed = (btn.getAttribute("data-roles") || "").split(",");
    if (allowed.includes(uRole)) { if (!firstAllowedBtn) firstAllowedBtn = btn; }
    else btn.style.display = "none";
  });
  const activeBtn = document.querySelector("#mainNav .n-btn.active");
  if (activeBtn && activeBtn.style.display === "none" && firstAllowedBtn) firstAllowedBtn.click();
}

function swTab(id, btn) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("open"));
  document.querySelectorAll(".n-btn").forEach(b => b.classList.remove("active"));
  if ($(id)) $(id).classList.add("open");
  if (btn) btn.classList.add("active");
}

async function loadDash() {
  const [r1, r2] = await Promise.all([fetch(API + "/requests"), fetch(API + "/requests/settings")]);
  if (r1.ok) reqs = (await r1.json()).requests || [];
  if (r2.ok) settings = (await r2.json()).settings || {};
  Object.keys(settings.techMeta || {}).forEach(t => { if (!techs.includes(t)) techs.push(t); });
  reqs.forEach(r => { if (r.technicianName && !techs.includes(r.technicianName)) techs.push(r.technicianName); });
  applyRoleAccess();
  renderAllPanels();
}

function renderAllPanels() {
  renderOrdersPanel(); renderSuspPanel(); renderRemPanel(); renderTechsPanel();
  renderWhPanel(); renderCustPanel(); renderArchPanel(); renderTrashPanel();
  renderCatPanel(); renderUsersPanel();
}

function renderOrdersPanel() {
  const active = reqs.filter(r => r.status === "pending" || r.status === "assigned" || r.status === "in_progress");
  $("cntOrd").textContent = active.length;
  const tOpts = techs.map(t => '<option value="' + t + '">' + t + '</option>').join("");
  $("p-orders").innerHTML =
    '<div class="card" style="background:#eff6ff;border-color:#93c5fd">' +
      '<b style="font-size:12px;color:#1e40af;display:block;margin-bottom:6px">➕ ثبت درخواست سرویس جدید و ارجاع به تکنسین:</b>' +
      '<div class="grid2">' +
        '<div><input id="nName" class="inp" placeholder="نام و نام خانوادگی مشتری *"><input id="nPh" class="inp" style="direction:ltr" placeholder="شماره موبایل *"></div>' +
        '<div><input id="nAddr" class="inp" placeholder="آدرس دقیق (مثلاً: ملاصدرا، کوچه ۵...) *"><div style="display:flex;gap:5px"><input id="nIss" class="inp" style="margin:0;flex:2" placeholder="شرح سرویس (تعویض فیلتر / خرابی)"><select id="nTech" class="inp" style="margin:0;flex:1"><option value="">بدون تکنسین</option>' + tOpts + '</select></div></div>' +
      '</div><button class="btn" style="width:100%;background:#0284c7;color:#fff;margin-top:6px" onclick="createNewOrder()">💾 ثبت سرویس و ارسال به کارتابل</button>' +
    '</div>' +
    (active.length ? active.map(r => '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px"><div><b>👤 ' + (r.snapshot?.fullName || "مشتری") + '</b> — <a href="tel:' + (r.snapshot?.phone || "") + '">' + (r.snapshot?.phone || "") + '</a> <span class="bdg st-a">' + (r.invoiceCode || "") + '</span></div><div style="display:flex;gap:5px;align-items:center"><select class="inp" style="margin:0;width:135px" onchange="assignTech(\'' + r._id + '\',this.value)"><option value="">ارجاع به تکنسین...</option>' + techs.map(t => '<option value="' + t + '" ' + (r.technicianName === t ? 'selected' : '') + '>' + t + '</option>').join("") + '</select><button class="btn" style="background:#ef4444;color:#fff;border:none" onclick="moveTrash(\'' + r._id + '\')">🗑️</button></div></div><div style="font-size:11px;color:#475569;margin-top:5px">📍 ' + (r.snapshot?.address || "---") + ' | 🔧 ' + (r.issueType || "سرویس") + '</div></div>').join("") : '<div class="card">سرویس فعالی وجود ندارد.</div>');
}
// PART 2 END
    async function createNewOrder() {
  const fullName = $("nName").value.trim(), phone = $("nPh").value.trim(), address = $("nAddr").value.trim(), issueType = $("nIss").value.trim() || "سرویس دوره‌ای", tech = $("nTech").value;
  if (!fullName || !phone) return alert("نام و موبایل مشتری الزامی است.");
  const r = await fetch(API + "/requests", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fullName, phone, address, issueType }) });
  if (r.ok && tech) { const d = await r.json(); if (d.request?._id) await assignTech(d.request._id, tech); }
  await loadDash();
}
async function assignTech(id, techName) {
  await fetch(API + "/requests/" + id + "/status", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: techName ? "assigned" : "pending", technicianName: techName }) });
  await loadDash();
}
async function moveTrash(id) {
  const rsn = prompt("علت حذف فاکتور:"); if (!rsn) return;
  await fetch(API + "/requests/" + id + "/status", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: "trashed", deleteReason: rsn }) });
  await loadDash();
}

function renderSuspPanel() {
  const list = reqs.filter(r => r.status === "suspended");
  $("cntSusp").textContent = list.length;
  $("p-susp").innerHTML = list.length ? list.map(r => '<div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap"><b>👤 ' + (r.snapshot?.fullName || "") + ' (' + (r.snapshot?.phone || "") + ')</b><span class="bdg st-p">تکنسین: ' + (r.technicianName || "---") + ' | موعد: ' + toJ(r.suspendUntil) + '</span></div><div style="font-size:11px;margin:5px 0">⏸️ علت تعلیق: <b>' + (r.suspendReason || "---") + '</b> | 📍 ' + (r.snapshot?.address || "") + '</div><button class="btn" style="background:#16a34a;color:#fff" onclick="assignTech(\'' + r._id + '\',\'' + (r.technicianName || "") + '\')">🔄 بازگردانی به خدمات جاری</button></div>').join("") : '<div class="card">مورد تعلیقی وجود ندارد.</div>';
}

function renderRemPanel() {
  const done = reqs.filter(r => r.status === "done" || r.status === "completed");
  const due = done.filter(r => { const days = 180 - Math.round((Date.now() - new Date(r.completedAt || r.createdAt).getTime()) / 86400000); return days <= 20; });
  $("cntRem").textContent = due.length;
  $("p-rem").innerHTML = due.length ? due.map(r => {
    const days = 180 - Math.round((Date.now() - new Date(r.completedAt || r.createdAt).getTime()) / 86400000);
    return '<div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px"><div><b>👤 ' + (r.snapshot?.fullName || "") + '</b> (' + (r.snapshot?.phone || "") + ') <span class="bdg st-al">' + (days <= 0 ? Math.abs(days) + ' روز گذشته' : days + ' روز مانده') + '</span><div style="font-size:11px;color:#475569">📍 ' + (r.snapshot?.address || "") + ' | آخرین سرویس: ' + toJ(r.completedAt) + '</div></div><a class="btn" style="background:#16a34a;color:#fff;text-decoration:none" href="sms:' + (r.snapshot?.phone || "") + '?body=' + encodeURIComponent("مشتری گرامی سامی‌واتر، موعد تعویض فیلتر دستگاه تصفیه آب شما فرا رسیده است.") + '">📲 ارسال پیامک یادآور</a></div>';
  }).join("") : '<div class="card">مشتری در موعد زیر ۲۰ روز وجود ندارد.</div>';
}

function renderTechsPanel() {
  const todoAll = reqs.filter(r => r.status === "assigned" || r.status === "in_progress");
  $("cntTech").textContent = todoAll.length;
  const fTodo = todoAll.filter(r => selTechFilter === "ALL" || r.technicianName === selTechFilter);
  const fDone = reqs.filter(r => (r.status === "done" || r.status === "completed") && !r.isSettled && (selTechFilter === "ALL" || r.technicianName === selTechFilter));
  const isLocked = selTechFilter !== "ALL" && settings.techMeta?.[selTechFilter]?.locked;

  $("p-techs").innerHTML =
    '<div class="card">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px">' +
        '<b style="font-size:13px;color:#0f3b2d">👨‍🔧 مدیریت عملیات و کارتابل تکنسین‌ها (امور مالی و تسویه در نرم‌افزار حسابداری است)</b>' +
        (uRole === "admin" ? '<a href="accounting.html' + (selTechFilter !== "ALL" ? '?tech=' + encodeURIComponent(selTechFilter) : '') + '" class="btn" style="background:#d9b24c;color:#071f17;text-decoration:none">📊 ورود به میز تسویه حسابداری</a>' : '') +
      '</div>' +
      '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">' +
        '<button class="btn" style="background:' + (selTechFilter === "ALL" ? '#0f172a;color:#fff' : '#e2e8f0;color:#1e293b') + '" onclick="selTechFilter=\'ALL\';renderTechsPanel()">👨‍🔧 همه تکنسین‌ها (' + todoAll.length + ')</button>' +
        techs.map(t => '<button class="btn" style="background:' + (selTechFilter === t ? '#0284c7;color:#fff' : '#e2e8f0;color:#1e293b') + '" onclick="selTechFilter=\'' + t + '\';renderTechsPanel()">👨‍🔧 ' + t + '</button>').join("") +
      '</div>' +
      (selTechFilter !== "ALL" ? '<div style="display:flex;gap:6px;flex-wrap:wrap;background:#f1f5f9;padding:8px;border-radius:8px;margin-bottom:8px"><button class="btn" style="background:' + (isLocked ? '#16a34a' : '#dc2626') + ';color:#fff" onclick="togTechLock(\'' + selTechFilter + '\')">' + (isLocked ? '🔓 باز کردن قفل کارتابل ' : '🔒 قفل فوری کارتابل و انبار ') + selTechFilter + '</button><a class="btn" style="background:#0284c7;color:#fff;text-decoration:none" href="sms:' + (settings.techMeta?.[selTechFilter]?.phone || "") + '">📲 ارسال پیامک به تکنسین</a></div>' : '') +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px">' +
        '<button class="btn" style="padding:9px;background:' + (techSubTab === "todo" ? '#0f172a;color:#fff' : '#fff;color:#0f172a') + '" onclick="techSubTab=\'todo\';renderTechsPanel()">⏳ ۱. در دست اقدام (' + fTodo.length + ')</button>' +
        '<button class="btn" style="padding:9px;background:' + (techSubTab === "done" ? '#16a34a;color:#fff' : '#fff;color:#0f172a') + '" onclick="techSubTab=\'done\';renderTechsPanel()">✅ ۲. تکمیل‌شده دوره (' + fDone.length + ')</button>' +
      '</div>' +
      ((techSubTab === "todo" ? fTodo : fDone).map(r => '<div style="padding:8px;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:5px;background:#fff;font-size:11px;display:flex;justify-content:space-between;flex-wrap:wrap"><div><b>' + (r.snapshot?.fullName || "") + '</b> (' + (r.snapshot?.phone || "") + ') — <span class="bdg st-a">' + (r.technicianName || "") + '</span><div style="color:#475569;margin-top:3px">📍 ' + (r.snapshot?.address || "") + ' | 🔧 ' + (r.workReport || r.issueType || "") + '</div></div><div><b>' + (r.invoiceCode || "") + '</b></div></div>').join("") || '<div style="font-size:11px;color:#64748b">موردی وجود ندارد.</div>') +
    '</div>';
}

async function togTechLock(tName) {
  const tm = settings.techMeta || {}; if (!tm[tName]) tm[tName] = {};
  tm[tName].locked = !tm[tName].locked;
  await fetch(API + "/requests/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ techMeta: tm }) });
  await loadDash();
}

function renderWhPanel() {
  const cStock = (settings.centralStock && settings.centralStock["اصفهان (مرکزی)"]) || {};
  const tStock = settings.techStock || {};
  const goods = (settings.catalog || []).filter(c => c.isGoods);
  const gOpts = goods.map(g => '<option value="' + g.title + '">' + g.title + ' (موجودی مرکزی: ' + fmt(cStock[g.title] || 0) + ')</option>').join("");
  const tOpts = techs.map(t => '<option value="' + t + '">' + t + '</option>').join("");
  $("p-wh").innerHTML = '<div class="grid2"><div class="card"><b>📤 حواله کالا از انبار مرکزی به انبار سیار تکنسین:</b><select id="whTech" class="inp" style="margin-top:6px">' + tOpts + '</select><select id="whItem" class="inp">' + gOpts + '</select><input id="whQty" type="text" inputmode="numeric" class="inp" style="direction:ltr;font-weight:bold" placeholder="تعداد حواله" value="1" oninput="onMoneyInp(this)"><button class="btn" style="width:100%;background:#0284c7;color:#fff" onclick="transferToTech()">📦 ثبت حواله به تکنسین</button></div><div class="card"><b>🏭 موجودی انبار مرکزی اصفهان:</b><table><thead><tr><th>نام کالا</th><th>موجودی مرکزی</th><th>جمع نزد تکنسین‌ها</th></tr></thead><tbody>' + goods.map(g => { const tSum = techs.reduce((s, t) => s + num(tStock[t]?.[g.title]), 0); return '<tr><td><b>' + g.title + '</b></td><td style="direction:ltr;font-weight:bold;color:#15803d">' + fmt(cStock[g.title] || 0) + '</td><td style="direction:ltr;color:#0284c7">' + fmt(tSum) + '</td></tr>'; }).join("") + '</tbody></table></div></div>';
}
async function transferToTech() {
  const techName = $("whTech").value, itemTitle = $("whItem").value, qty = num($("whQty").value);
  if (!techName || !itemTitle || qty <= 0) return alert("کالا و تعداد را مشخص کنید.");
  await fetch(API + "/requests/warehouse-op", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ opType: "central_to_tech", branch: "اصفهان (مرکزی)", techName, itemTitle, qty, byUser: uName }) });
  await loadDash(); alert("✅ حواله ثبت شد.");
}
// PART 3 END
    let custRegFilter = "ALL", custSearch = "", openTicketPh = "";
function renderCustPanel() {
  const map = {};
  reqs.forEach(r => {
    const ph = normPh(r.snapshot?.phone); if (!ph) return;
    if (!map[ph] || new Date(r.createdAt) > new Date(map[ph].lastDate)) {
      map[ph] = { name: r.snapshot?.fullName || "مشتری", phone: r.snapshot?.phone || ph, addr: r.snapshot?.address || "", lastDate: r.completedAt || r.createdAt };
    }
  });
  const custRegions = settings.customerRegions || {}, allTickets = settings.customerTickets || [];
  const allCusts = Object.keys(map).map(ph => ({ ...map[ph], phKey: ph, region: detectRegion(map[ph].addr, custRegions[ph]), tickets: allTickets.filter(tk => normPh(tk.phone) === ph) }));
  const filtered = allCusts.filter(c => (custRegFilter === "ALL" || c.region === custRegFilter) && (!custSearch || c.name.includes(custSearch) || c.phone.includes(custSearch) || c.addr.includes(custSearch)));
  const regOpts = '<option value="ALL">📍 همه مناطق اصفهان (' + allCusts.length + ')</option>' + ISF_REGIONS.map(r => '<option value="' + r + '" ' + (custRegFilter === r ? 'selected' : '') + '>محله ' + r + '</option>').join("") + '<option value="سایر مناطق" ' + (custRegFilter === "سایر مناطق" ? 'selected' : '') + '>سایر مناطق</option>';

  $("p-cust").innerHTML =
    '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px"><b style="font-size:13px;color:#0f3b2d">👥 بانک اطلاعات مشتریان، منطقه‌بندی هوشمند آدرس و تیکت‌ها</b><button class="btn" style="background:#16a34a;color:#fff" onclick="sendRegionalSms()">📲 ارسال پیامک به مشتریان منطقه انتخابی (' + filtered.length + ' نفر)</button></div>' +
    '<div class="grid2"><input class="inp" placeholder="🔍 جستجوی نام، تلفن یا آدرس..." value="' + custSearch + '" oninput="custSearch=this.value;renderCustPanel()"><select class="inp" onchange="custRegFilter=this.value;renderCustPanel()">' + regOpts + '</select></div>' +
    '<div style="overflow-x:auto"><table><thead><tr><th>مشتری</th><th>تلفن</th><th>منطقه (هوشمند/دستی)</th><th>آدرس</th><th>🎫 تیکت‌ها (از جدید به قدیم)</th></tr></thead><tbody>' +
    filtered.slice(0, 60).map(c => '<tr><td><b>' + c.name + '</b></td><td style="direction:ltr">' + c.phone + '</td><td><select class="inp" style="margin:0;width:115px;font-size:10px" onchange="setCustReg(\'' + c.phKey + '\',this.value)">' + [...ISF_REGIONS, "سایر مناطق"].map(r => '<option value="' + r + '" ' + (c.region === r ? 'selected' : '') + '>' + r + '</option>').join("") + '</select></td><td>' + c.addr + '</td><td><button class="btn" style="background:' + (c.tickets.length ? '#be123c' : '#475569') + ';color:#fff;padding:4px 8px" onclick="openTicketPh=(openTicketPh===\'' + c.phKey + '\'?\'\':\'' + c.phKey + '\');renderCustPanel()">🎫 تیکت‌ها (' + c.tickets.length + ')</button>' +
      (openTicketPh === c.phKey ? '<div style="margin-top:5px;background:#fff1f2;padding:6px;border-radius:6px;border:1px solid #fda4af">' + (c.tickets.length ? c.tickets.map(tk => '<div style="border-bottom:1px dashed #fecdd3;padding:3px 0"><b>' + tk.date + ' (' + (tk.techName || "سیستم") + '):</b> <span class="bdg st-al">' + (tk.tag || "نکته") + '</span> ' + (tk.note || "") + '</div>').join("") : '<div>تیکتی ثبت نشده.</div>') + '<div style="display:flex;gap:4px;margin-top:4px"><input id="newTk_' + c.phKey + '" class="inp" style="margin:0" placeholder="ثبت تیکت جدید..."><button class="btn" style="background:#be123c;color:#fff" onclick="addCustTk(\'' + c.phone + '\',\'' + c.name + '\',\'' + c.phKey + '\')">+</button></div></div>' : '') +
    '</td></tr>').join("") + '</tbody></table></div></div>';
}
async function setCustReg(phKey, reg) {
  const cr = settings.customerRegions || {}; cr[phKey] = reg;
  await fetch(API + "/requests/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ customerRegions: cr }) });
  await loadDash();
}
async function addCustTk(phone, customerName, phKey) {
  const note = $("newTk_" + phKey).value.trim(); if (!note) return;
  const tkList = settings.customerTickets || [];
  tkList.unshift({ id: "tk_" + Date.now(), date: toJ(new Date()), phone, customerName, techName: uName, tag: "یادداشت مدیریت/پشتیبانی", note });
  await fetch(API + "/requests/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ customerTickets: tkList }) });
  await loadDash();
}
function sendRegionalSms() {
  const msg = prompt("متن پیامک برای ارسال به مشتریان منطقه «" + custRegFilter + "»:"); if (!msg) return;
  alert("📲 آماده ارسال پیامک هدفمند به مشتریان منطقه «" + custRegFilter + "»:\n" + msg);
}

function renderArchPanel() {
  const done = reqs.filter(r => r.status === "done" || r.status === "completed");
  $("p-arch").innerHTML = '<div class="card"><b>🗂️ بایگانی کل خدمات انجام‌شده (' + done.length + ' سرویس):</b><div style="overflow-x:auto"><table><thead><tr><th>فاکتور</th><th>تاریخ</th><th>مشتری</th><th>تکنسین</th><th>گزارش و تیکت</th><th>مبلغ</th></tr></thead><tbody>' + done.slice(0, 60).map(r => '<tr><td><b>' + (r.invoiceCode || "") + '</b></td><td>' + toJ(r.completedAt || r.createdAt) + '</td><td>' + (r.snapshot?.fullName || "") + '</td><td>' + (r.technicianName || "") + '</td><td>' + (r.workReport || "") + '</td><td style="direction:ltr;font-weight:bold">' + fmt(r.payableAmount) + ' ت</td></tr>').join("") + '</tbody></table></div></div>';
}
function renderTrashPanel() {
  const tr = reqs.filter(r => r.status === "trashed"); $("cntTr").textContent = tr.length;
  $("p-trash").innerHTML = '<div class="card"><b>🗑️ فاکتورهای حذفی (' + tr.length + '):</b>' + (tr.map(r => '<div style="padding:6px;border-bottom:1px solid #cbd5e1;font-size:11px;display:flex;justify-content:space-between"><span><b>' + (r.snapshot?.fullName || "") + '</b> — علت حذف: ' + (r.deleteReason || "---") + '</span><button class="btn" onclick="assignTech(\'' + r._id + '\',\'\')">♻️ بازیابی</button></div>').join("") || '<div>خالی است.</div>') + '</div>';
}

function renderCatPanel() {
  const cat = settings.catalog || [];
  $("p-cat").innerHTML = '<div class="card"><b>🏷️ تعرفه کالاها، قیمت خرید شرکت، قیمت فروش مشتری و دستمزد تکنسین:</b><div class="grid2" style="margin-top:6px"><div><input id="cTit" class="inp" placeholder="نام کالا یا خدمت *"><input id="cBuy" type="text" inputmode="numeric" class="inp" style="direction:ltr" placeholder="قیمت خرید شرکت (تومان)" oninput="onMoneyInp(this)"></div><div><input id="cPr" type="text" inputmode="numeric" class="inp" style="direction:ltr" placeholder="قیمت فروش به مشتری (تومان) *" oninput="onMoneyInp(this)"><div style="display:flex;gap:5px"><input id="cWg" type="text" inputmode="numeric" class="inp" style="margin:0;direction:ltr;flex:2" placeholder="دستمزد تکنسین *" oninput="onMoneyInp(this)"><select id="cGd" class="inp" style="margin:0;flex:1"><option value="1">📦 کالا (انباری)</option><option value="0">🔧 خدمات</option></select></div></div></div><button class="btn" style="width:100%;background:#16a34a;color:#fff;margin-top:5px" onclick="addCatItem()">➕ افزودن/بروزرسانی تعرفه</button><div style="overflow-x:auto"><table><thead><tr><th>شرح</th><th>نوع</th><th>فی خرید شرکت</th><th>فروش مشتری</th><th>سهم تکنسین</th><th>حذف</th></tr></thead><tbody>' + cat.map((c, i) => '<tr><td><b>' + c.title + '</b></td><td>' + (c.isGoods ? '📦 کالا' : '🔧 خدمت') + '</td><td style="direction:ltr;color:#b45309">' + fmt(c.buyPrice || 0) + ' ت</td><td style="direction:ltr;font-weight:bold">' + fmt(c.customerPrice) + ' ت</td><td style="direction:ltr;color:#15803d">' + fmt(c.techWage) + ' ت</td><td><button class="btn" style="background:#ef4444;color:#fff;padding:2px 6px" onclick="delCat(' + i + ')">×</button></td></tr>').join("") + '</tbody></table></div></div>';
}
async function addCatItem() {
  const title = $("cTit").value.trim(), buyPrice = num($("cBuy").value), customerPrice = num($("cPr").value), techWage = num($("cWg").value), isGoods = $("cGd").value === "1";
  if (!title || customerPrice <= 0) return alert("نام و قیمت فروش الزامی است.");
  const cat = (settings.catalog || []).filter(c => c.title !== title);
  cat.push({ title, buyPrice, customerPrice, techWage, isGoods });
  await fetch(API + "/requests/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ catalog: cat }) });
  await loadDash();
}
async function delCat(i) { const cat = settings.catalog || []; cat.splice(i, 1); await fetch(API + "/requests/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ catalog: cat }) }); await loadDash(); }

const ROLE_PERMS = {
  support: { label: "🎧 نیروی پشتیبانی خدمات", desc: "فقط دسترسی به: خدمات جاری، تعلیقی‌ها، یادآور سرویس، وضعیت تکنسین‌ها و بانک مشتریان (بدون حسابداری و انبار)" },
  tech: { label: "👨‍🔧 تکنسین فنی", desc: "فقط دسترسی به: کارتابل خدمات اختصاص‌داده‌شده به شخص خودش و انبار سیار خودش در پنل تکنسین" },
  warehouse: { label: "🏭 انباردار", desc: "فقط دسترسی به: انبار مرکزی و ثبت حواله کالا" },
  accountant: { label: "📊 حسابدار", desc: "فقط دسترسی به: نرم‌افزار تخصصی حسابداری ۶ بخشی" },
  callcenter: { label: "📞 کال‌سنتر یادآور", desc: "فقط دسترسی به: یادآور سرویس، تعلیقی‌ها و بانک مشتریان" },
  supervisor: { label: "🛡️ سرپرست عملیات", desc: "دسترسی به: خدمات، تکنسین‌ها، انبار و مشتریان (بدون تعرفه و حسابداری)" }
};
function renderUsersPanel() {
  const users = settings.staffUsers || [];
  $("p-users").innerHTML = '<div class="card"><b style="font-size:13px;color:#0f3b2d;display:block;margin-bottom:6px">🔐 خلق دکمه کاربری با سطح دسترسیِ از پیش قفل‌شده (RBAC):</b><div class="grid2"><div><select id="uRoleSel" class="inp" onchange="$(\'rolePermDesc\').textContent=ROLE_PERMS[this.value].desc">' + Object.keys(ROLE_PERMS).map(k => '<option value="' + k + '">' + ROLE_PERMS[k].label + '</option>').join("") + '</select><div id="rolePermDesc" style="font-size:11px;background:#fef9c3;padding:6px;border-radius:6px;margin-bottom:6px;color:#854d0e">' + ROLE_PERMS.support.desc + '</div><input id="uFullName" class="inp" placeholder="نام شخص (مثلاً: خانم رضایی / مهندس کریمی) *"></div><div><input id="uPhone" class="inp" style="direction:ltr" placeholder="شماره موبایل شخص"><div style="display:flex;gap:5px"><input id="uUser" class="inp" style="direction:ltr" placeholder="نام کاربری (خودکار/دستی)"><input id="uPass" class="inp" style="direction:ltr" placeholder="رمز عبور (خودکار/دستی)"></div><button class="btn" style="width:100%;background:#0284c7;color:#fff" onclick="genAutoCreds()">🎲 تولید خودکار نام کاربری و رمز</button></div></div><button class="btn" style="width:100%;background:#16a34a;color:#fff;margin-top:6px;padding:10px" onclick="createStaffRoleUser()">✅ خلق کاربر با دسترسیِ قفل‌شده این نقش</button><div style="overflow-x:auto;margin-top:8px"><table><thead><tr><th>نام شخص</th><th>نقش و دسترسی قفل‌شده</th><th>نام کاربری</th><th>رمز عبور</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>' + users.map((u, i) => '<tr><td><b>' + u.fullName + '</b></td><td>' + (ROLE_PERMS[u.role]?.label || u.role) + '</td><td style="direction:ltr"><b>' + u.username + '</b></td><td style="direction:ltr">' + u.password + '</td><td>' + (u.locked ? '<span class="bdg st-al">🔒 قفل</span>' : '<span class="bdg st-d">🟢 فعال</span>') + '</td><td><button class="btn" style="background:' + (u.locked ? '#16a34a' : '#d97706') + ';color:#fff;padding:3px 7px" onclick="togStaffLock(' + i + ')">' + (u.locked ? '🔓 باز کردن' : '🔒 قفل آنی') + '</button> <button class="btn" style="background:#ef4444;color:#fff;padding:3px 7px" onclick="delStaffUser(' + i + ')">🗑️</button></td></tr>').join("") + '</tbody></table></div></div>';
}
function genAutoCreds() {
  const r = $("uRoleSel").value;
  $("uUser").value = r + "_" + Math.floor(100 + Math.random() * 900);
  $("uPass").value = String(Math.floor(100000 + Math.random() * 900000));
}
async function createStaffRoleUser() {
  const role = $("uRoleSel").value, fullName = $("uFullName").value.trim(), phone = $("uPhone").value.trim();
  if (!fullName) return alert("نام شخص را وارد کنید.");
  if (!$("uUser").value.trim() || !$("uPass").value.trim()) genAutoCreds();
  const username = $("uUser").value.trim(), password = $("uPass").value.trim();
  const users = settings.staffUsers || [], tm = settings.techMeta || {};
  users.unshift({ id: "usr_" + Date.now(), role, fullName, phone, username, password, locked: false, createdAt: toJ(new Date()) });
  if (role === "tech") {
    if (!techs.includes(fullName)) { techs.push(fullName); localStorage.setItem("sw_techs", JSON.stringify(techs)); }
    tm[fullName] = { ...(tm[fullName] || {}), phone, username, password, locked: false };
  }
  await fetch(API + "/requests/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ staffUsers: users, techMeta: tm }) });
  await loadDash(); alert(`✅ کاربر «${fullName}» با نقش «${ROLE_PERMS[role].label}» خلق شد.\nنام کاربری: ${username}\nرمز عبور: ${password}`);
}
async function togStaffLock(i) {
  const users = settings.staffUsers || [], u = users[i]; if (!u) return;
  u.locked = !u.locked;
  const tm = settings.techMeta || {}; if (u.role === "tech" && tm[u.fullName]) tm[u.fullName].locked = u.locked;
  await fetch(API + "/requests/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ staffUsers: users, techMeta: tm }) });
  await loadDash();
}
async function delStaffUser(i) {
  if (!confirm("این کاربر و دسترسی او حذف شود؟")) return;
  const users = settings.staffUsers || []; users.splice(i, 1);
  await fetch(API + "/requests/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ staffUsers: users }) });
  await loadDash();
}
loadDash();
</script>
