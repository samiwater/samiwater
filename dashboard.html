<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل جامع مدیریت سامی‌واتر</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,sans-serif}
body{background:#eef2f6;color:#1e293b;padding:8px}
.wrap{width:100%;max-width:1400px;margin:0 auto}
.hdr{background:#1e293b;color:#fff;padding:14px;border-radius:18px;margin-bottom:12px;box-shadow:0 6px 18px #0002}
.hdr-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.logo-box{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#0d9488,#065f46);border:2px solid #eab308;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fde047;font-size:15px}
.hdr-title{font-size:16px;font-weight:bold;color:#38bdf8}
.pills-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-bottom:6px}
.pill{padding:5px 11px;border-radius:16px;font-size:11px;font-weight:bold;text-decoration:none;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media(min-width:900px){.nav-grid{grid-template-columns:repeat(5,1fr)}}
.n-btn{background:#334155;color:#f8fafc;border:1px solid #475569;padding:12px 8px;border-radius:12px;font-size:12px;font-weight:bold;cursor:pointer;text-align:center}
.n-btn.active{background:#0284c7;color:#fff;border-color:#38bdf8;box-shadow:0 4px 12px #0284c766}
.n-btn.exit{background:#dc2626;color:#fff;border-color:#ef4444}
.panel{display:none;background:#fff;border-radius:16px;padding:14px;border:1px solid #e2e8f0;margin-bottom:14px;box-shadow:0 2px 8px #0001}
.panel.open{display:block}
.sec-ttl{font-size:14px;font-weight:bold;color:#0f172a;padding-bottom:10px;border-bottom:1px solid #e2e8f0;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.card{background:#f8fafc;border:1.5px solid #cbd5e1;border-radius:12px;padding:11px;margin-bottom:9px}
.drw{background:#fff;border:1.5px solid #cbd5e1;border-radius:12px;margin-bottom:8px;overflow:hidden}
.drw-h{padding:11px 12px;background:#f8fafc;cursor:pointer;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px;font-weight:bold}
.drw-b{display:none;padding:12px;border-top:1px solid #cbd5e1;background:#fff;font-size:12px;line-height:1.9}
.drw-b.open{display:block}
.inp{width:100%;padding:9px 10px;border:1.5px solid #cbd5e1;border-radius:10px;font-size:12px;margin-bottom:6px;font-family:inherit}
.btn{background:#0284c7;color:#fff;border:none;padding:8px 12px;border-radius:9px;cursor:pointer;font-size:11px;font-weight:bold}
.bdg{padding:4px 8px;border-radius:7px;font-size:11px;font-weight:bold;display:inline-block}
.st-a{background:#e0f2fe;color:#0369a1}.st-d{background:#dcfce7;color:#15803d}.st-p{background:#fef3c7;color:#b45309}.st-al{background:#fee2e2;color:#dc2626}.st-chk{background:#f3e8ff;color:#7e22ce}
.t-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;border:1.5px solid #cbd5e1;background:#fff;font-size:11px;font-weight:bold;cursor:pointer}
.t-chip.active{background:#0f172a;color:#38bdf8;border-color:#0f172a}
.grid2{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
table{width:100%;border-collapse:collapse;margin-top:6px}
th,td{border:1px solid #cbd5e1;padding:6px;text-align:right;font-size:11px}
th{background:#f1f5f9}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="hdr-top">
      <div class="logo-box">SA</div>
      <div class="hdr-title">پنل جامع مدیریت سامی‌واتر</div>
    </div>
    <div class="pills-row">
      <a href="tech.html" class="pill" style="background:#064e3b;color:#4ade80;border:1px solid #22c55e">📱 پنل تکنسین</a>
      <a href="accounting.html" class="pill" style="background:#1e293b;color:#fde047;border:1px solid #eab308">📊 نرم‌افزار حسابداری</a>
      <span class="pill" style="background:#0f172a;color:#38bdf8;border:1px solid #0284c7" onclick="loadDash()">🟢 آنلاین</span>
    </div>
    <div class="pills-row">
      <span id="uBadge" class="pill" style="background:#1e293b;color:#facc15;border:1px solid #eab308">👑 مدیر ارشد (مدیر ارشد)</span>
    </div>
    <div class="nav-grid">
      <button class="n-btn" onclick="swTab('p-orders',this)">📋 خدمات جاری (<span id="cntOrd">0</span>)</button>
      <button class="n-btn" onclick="swTab('p-susp',this)">⏸️ تعلیقی تکنسین (<span id="cntSusp">0</span>)</button>
      <button class="n-btn active" onclick="swTab('p-techs',this)">👨‍🔧 تکنسین‌ها و تسویه (<span id="cntTech">0</span>)</button>
      <button class="n-btn" onclick="swTab('p-wh',this)">🏭 انبار مرکزی و حواله</button>
      <button class="n-btn" onclick="swTab('p-rem',this)">🔔 یادآور سرویس (<span id="cntRem">0</span>)</button>
      <button class="n-btn" onclick="swTab('p-arch',this)">📁 بایگانی خدمات</button>
      <button class="n-btn" onclick="swTab('p-trash',this)">🗑️ فاکتورهای حذفی (<span id="cntTr">0</span>)</button>
      <button class="n-btn" onclick="swTab('p-cust',this)">👥 بانک اطلاعات و تایمر</button>
      <button class="n-btn" onclick="swTab('p-cat',this)">🏷️ تعرفه کالا و دستمزد</button>
      <button class="n-btn exit" onclick="localStorage.removeItem('token');location.href='login.html'">🚪 خروج</button>
    </div>
  </div>

  <div id="p-orders" class="panel"></div>
  <div id="p-susp" class="panel"></div>
  <div id="p-techs" class="panel open"></div>
  <div id="p-wh" class="panel"></div>
  <div id="p-rem" class="panel"></div>
  <div id="p-arch" class="panel"></div>
  <div id="p-trash" class="panel"></div>
  <div id="p-cust" class="panel"></div>
  <div id="p-cat" class="panel"></div>
</div>
<!-- PART 1 END -->
  <script>
const API = "https://samiwater-backend.onrender.com/api";
const $ = id => document.getElementById(id);
const num = v => Math.round(Number(String(v || 0).replace(/,/g, "")) || 0);
const fmt = n => num(n).toLocaleString("fa-IR");
function toJ(d, withTime) {
  if (!d) return "---";
  try {
    const dt = new Date(d);
    let s = new Intl.DateTimeFormat("fa-IR", { year: "numeric", month: "2-digit", day: "2-digit" }).format(dt);
    if (withTime) s += " ساعت " + new Intl.DateTimeFormat("fa-IR", { hour: "2-digit", minute: "2-digit", hour12: false }).format(dt);
    ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"].forEach((p, i) => s = s.replace(new RegExp(p, "g"), i));
    return s;
  } catch (e) { return "---"; }
}
function normPh(p) { return String(p || "").replace(/\D/g, "").slice(-10); }

if (!localStorage.getItem("token")) location.href = "login.html";
const uRole = localStorage.getItem("role") || "admin", uName = localStorage.getItem("username") || "مدیر ارشد";
$("uBadge").textContent = "👑 " + (uRole === "admin" ? "مدیر ارشد" : uName) + " (" + uName + ")";

let reqs = [], settings = {}, techs = JSON.parse(localStorage.getItem("sw_techs") || '["مهندس شهریاری","تکنسین ۱","تکنسین ۲"]');
let selTechFilter = "ALL", techSubTab = "todo", openOrdId = "", openTechOrdId = "", openCustPh = "";

function swTab(id, btn) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("open"));
  document.querySelectorAll(".n-btn").forEach(b => b.classList.remove("active"));
  if ($(id)) $(id).classList.add("open");
  if (btn) btn.classList.add("active");
}

async function loadDash() {
  const [r1, r2] = await Promise.all([fetch(API + "/requests"), fetch(API + "/requests/settings")]);
  if (r1.ok) reqs = (await r1.json()).requests || [];
  if (r2.ok) settings = (await r2.json()).settings || {};
  Object.keys(settings.techMeta || {}).forEach(t => { if (!techs.includes(t)) techs.push(t); });
  reqs.forEach(r => { if (r.technicianName && !techs.includes(r.technicianName)) techs.push(r.technicianName); });
  renderAll();
}

function renderAll() {
  renderOrdersPanel(); renderSuspPanel(); renderTechsPanel();
  renderWhPanel(); renderRemPanel(); renderArchPanel();
  renderTrashPanel(); renderCustPanel(); renderCatPanel();
}

function getCustomerFullProfile(phone, name) {
  const cPh = normPh(phone);
  const all = reqs.filter(x => (cPh && normPh(x.snapshot?.phone) === cPh) || (name && x.snapshot?.fullName === name));
  const addrs = [...new Set(all.map(x => x.snapshot?.address).filter(Boolean))];
  const phones = [...new Set(all.map(x => x.snapshot?.phone).filter(Boolean))];
  const doneList = all.filter(x => x.status === "done" || x.status === "completed");
  return { all, addrs, phones, doneList };
}

function renderOrdersPanel() {
  const active = reqs.filter(r => r.status === "pending" || r.status === "assigned" || r.status === "in_progress");
  $("cntOrd").textContent = active.length;
  const tOpts = techs.map(t => '<option value="' + t + '">' + t + '</option>').join("");
  $("p-orders").innerHTML =
    '<div class="sec-ttl"><span>📋 مدیریت خدمات جاری و ثبت سفارش جدید</span></div>' +
    '<div class="card">' +
      '<div class="grid2">' +
        '<div><input id="nName" class="inp" placeholder="نام و نام خانوادگی مشتری *"><input id="nPh" class="inp" style="direction:ltr" placeholder="شماره تماس مشتری *"></div>' +
        '<div><input id="nAddr" class="inp" placeholder="آدرس کامل مشتری *"><div style="display:flex;gap:6px"><input id="nIss" class="inp" style="margin:0;flex:2" placeholder="نوع درخواست / توضیحات"><select id="nTech" class="inp" style="margin:0;flex:1"><option value="">ارجاع به تکنسین...</option>' + tOpts + '</select></div></div>' +
      '</div><button class="btn" style="width:100%;padding:10px;margin-top:6px" onclick="createNewOrder()">➕ ثبت درخواست و ارسال به کارتابل</button>' +
    '</div>' +
    (active.length ? active.map(r => {
      const cust = r.snapshot?.fullName || "مشتری", ph = r.snapshot?.phone || "", addr = r.snapshot?.address || "---";
      const prof = getCustomerFullProfile(ph, cust), isOp = openOrdId === r._id;
      return '<div class="drw">' +
        '<div class="drw-h" onclick="openOrdId=(openOrdId===\'' + r._id + '\'?\'\':\'' + r._id + '\');renderOrdersPanel()">' +
          '<div>👤 <b>' + cust + '</b> — <span style="direction:ltr">' + ph + '</span> <span class="bdg st-a">' + (r.invoiceCode || "---") + '</span> ' + (r.technicianName ? '<span class="bdg st-d">👨‍🔧 ' + r.technicianName + '</span>' : '<span class="bdg st-al">بدون تکنسین</span>') + '</div>' +
          '<div style="font-size:11px;color:#475569">🕒 ' + toJ(r.createdAt, true) + ' | مشاهده تمام آدرس‌ها و پرونده ▾</div>' +
        '</div>' +
        '<div class="drw-b ' + (isOp ? 'open' : '') + '">' +
          '<div>📍 <b>آدرس این سفارش:</b> ' + addr + '</div>' +
          '<div>🏠 <b>تمام آدرس‌های ثبت‌شده مشتری (' + prof.addrs.length + ' آدرس):</b> ' + (prof.addrs.join(" ، ") || addr) + '</div>' +
          '<div>📞 <b>شماره‌های تماس مشتری:</b> ' + prof.phones.map(p => '<a href="tel:' + p + '" style="color:#0284c7;font-weight:bold;margin-left:8px">' + p + '</a>').join("") + '</div>' +
          '<div>🔧 <b>شرح درخواست / یادداشت:</b> ' + (r.issueType || "سرویس دوره‌ای") + ' | 📜 <b>تعداد سرویس‌های قبلی:</b> ' + prof.doneList.length + ' بار</div>' +
          (prof.doneList.length ? '<div style="background:#f8fafc;padding:7px;border-radius:8px;border:1px solid #cbd5e1;margin-top:4px"><b>آخرین سوابق سرویس مشتری:</b>' + prof.doneList.slice(0, 3).map(h => '<div>• ' + toJ(h.completedAt || h.createdAt) + ' (' + (h.technicianName || "---") + '): ' + (h.workReport || h.issueType || "سرویس") + ' — ' + fmt(h.payableAmount) + ' ت</div>').join("") + '</div>' : '') +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed #cbd5e1">' +
            '<select class="inp" style="margin:0;width:165px" onchange="assignTech(\'' + r._id + '\',this.value)"><option value="">انتخاب تکنسین...</option>' + techs.map(t => '<option value="' + t + '" ' + (r.technicianName === t ? 'selected' : '') + '>' + t + '</option>').join("") + '</select>' +
            '<button class="btn" style="background:#16a34a" onclick="sendCustSms(\'' + r._id + '\',\'' + ph + '\',\'' + cust + '\',\'' + (r.technicianName || "") + '\')">📲 پیامک به مشتری ' + (r.smsSentAt ? '(✅ ' + r.smsSentAt + ')' : '') + '</button>' +
            '<button class="btn" style="background:#0284c7" onclick="editOrderNote(\'' + r._id + '\')">✏️ ویرایش توضیحات</button>' +
            '<button class="btn" style="background:#dc2626" onclick="moveTrash(\'' + r._id + '\')">🗑️ حذف فاکتور</button>' +
          '</div>' +
        '</div></div>';
    }).join("") : '<div class="card">سرویس فعالی در جریان نیست.</div>');
}
// PART 2 END
    async function createNewOrder() {
  const fullName = $("nName").value.trim(), phone = $("nPh").value.trim(), address = $("nAddr").value.trim(), issueType = $("nIss").value.trim() || "سرویس دوره‌ای", tech = $("nTech").value;
  if (!fullName || !phone) return alert("نام و شماره تماس مشتری الزامی است.");
  const r = await fetch(API + "/requests", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fullName, phone, address, issueType }) });
  if (r.ok && tech) { const d = await r.json(); if (d.request?._id) await assignTech(d.request._id, tech); }
  await loadDash();
}
async function assignTech(id, techName) {
  await fetch(API + "/requests/" + id + "/status", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: techName ? "assigned" : "pending", technicianName: techName }) });
  await loadDash();
}
async function sendCustSms(id, ph, cust, tech) {
  const tm = toJ(new Date(), true);
  await fetch(API + "/requests/" + id + "/status", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ smsSentAt: tm }) });
  location.href = "sms:" + ph + "?body=" + encodeURIComponent(`مشتری گرامی ${cust}، سرویس تصفیه آب سامی‌واتر ثبت و به تکنسین (${tech || "فنی"}) ارجاع گردید.`);
  setTimeout(loadDash, 700);
}
async function editOrderNote(id) {
  const r = reqs.find(x => x._id === id); if (!r) return;
  const v = prompt("ویرایش توضیحات و یادداشت سفارش:", r.issueType || ""); if (v === null) return;
  await fetch(API + "/requests/" + id + "/status", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ issueType: v }) });
  await loadDash();
}
async function moveTrash(id) {
  const rsn = prompt("علت حذف فاکتور را وارد کنید:"); if (!rsn) return;
  await fetch(API + "/requests/" + id + "/status", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: "trashed", deleteReason: rsn }) });
  await loadDash();
}

function renderTechsPanel() {
  const todoAll = reqs.filter(r => r.status === "assigned" || r.status === "in_progress");
  $("cntTech").textContent = todoAll.length;
  const fTodo = todoAll.filter(r => selTechFilter === "ALL" || r.technicianName === selTechFilter);
  const fDone = reqs.filter(r => (r.status === "done" || r.status === "completed") && !r.isSettled && (selTechFilter === "ALL" || r.technicianName === selTechFilter));

  let sumPos = 0, posCnt = 0, sumCash = 0, sumChk = 0, unpaidAmt = 0, unpaidCnt = 0, sumWage = 0, totalBill = 0;
  fDone.forEach(r => {
    const a = num(r.payableAmount) > 0 ? num(r.payableAmount) : (num(r.travelFee) || 139000);
    const w = num(r.techProfit) > 0 ? num(r.techProfit) : (num(r.travelFee) || 139000);
    if (!r.paymentMethod || r.paymentMethod === "unpaid") { unpaidAmt += a; unpaidCnt++; return; }
    totalBill += a; sumWage += w;
    const pb = r.paymentBreakdown;
    if (pb && (num(pb.pos) > 0 || num(pb.cash) > 0 || num(pb.check) > 0)) {
      if (num(pb.pos) > 0) { sumPos += num(pb.pos); posCnt++; }
      sumCash += num(pb.cash); sumChk += num(pb.check);
    } else if (r.paymentMethod === "pos") { sumPos += a; posCnt++; }
    else if (r.paymentMethod === "check") sumChk += a;
    else sumCash += a;
  });

  const curList = techSubTab === "todo" ? fTodo : fDone;

  $("p-techs").innerHTML =
    '<div class="sec-ttl"><span>👨‍🔧 کارتابل و حسابرسی تکنسین‌ها</span></div>' +
    '<div style="display:flex;gap:8px;margin-bottom:10px">' +
      '<input id="newTechInp" class="inp" style="margin:0;flex:1" placeholder="نام تکنسین جدید...">' +
      '<button class="btn" onclick="addNewTech()">+ افزودن تکنسین</button>' +
    '</div>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">' +
      '<div class="t-chip ' + (selTechFilter === "ALL" ? 'active' : '') + '" onclick="selTechFilter=\'ALL\';renderTechsPanel()">👨‍🔧 همه تکنسین‌ها (' + todoAll.length + ')</div>' +
      techs.map(t => {
        const cnt = todoAll.filter(x => x.technicianName === t).length;
        return '<div class="t-chip ' + (selTechFilter === t ? 'active' : '') + '" onclick="selTechFilter=\'' + t + '\';renderTechsPanel()"><span>👨‍🔧 ' + t + ' (' + cnt + ')</span><span style="color:#ef4444;font-weight:bold;padding:0 3px" onclick="event.stopPropagation();delTech(\'' + t + '\')">×</span></div>';
      }).join("") +
    '</div>' +
    '<div class="card">' +
      '<div style="font-size:12px;font-weight:bold;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">' +
        '<span>📊 میز حسابرسی دوره جاری (' + (selTechFilter === "ALL" ? "کل تکنسین‌ها" : selTechFilter) + '):</span>' +
        '<a href="accounting.html' + (selTechFilter !== "ALL" ? '?tech=' + encodeURIComponent(selTechFilter) : '') + '" class="btn" style="background:#0f3b2d;color:#fde047;text-decoration:none">📊 انجام تسویه در حسابداری</a>' +
      '</div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">' +
        '<span class="bdg st-a">📁 در دست اقدام: ' + fTodo.length + '</span>' +
        '<span class="bdg st-a">💳 جمع پوز: ' + fmt(sumPos) + ' ت (' + posCnt + ' تراکنش)</span>' +
        '<span class="bdg st-p">💵 جمع نقدی: ' + fmt(sumCash) + ' ت</span>' +
        '<span class="bdg st-chk">📝 جمع چک: ' + fmt(sumChk) + ' ت</span>' +
        '<span class="bdg st-al">🔴 پرداخت‌نشده: ' + fmt(unpaidAmt) + ' ت (' + unpaidCnt + ' مورد)</span>' +
        '<span class="bdg st-d">📈 سود تکنسین: +' + fmt(sumWage) + ' ت</span>' +
        '<span class="bdg" style="background:#0f172a;color:#facc15">💰 کل صورتحساب دوره: ' + fmt(totalBill) + ' ت</span>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">' +
        '<button class="btn" style="padding:10px;background:' + (techSubTab === "todo" ? '#0f172a;color:#38bdf8' : '#fff;color:#0f172a;border:1px solid #cbd5e1') + '" onclick="techSubTab=\'todo\';renderTechsPanel()">⏳ ۱. در دست اقدام (' + fTodo.length + ')</button>' +
        '<button class="btn" style="padding:10px;background:' + (techSubTab === "done" ? '#0f172a;color:#4ade80' : '#fff;color:#0f172a;border:1px solid #cbd5e1') + '" onclick="techSubTab=\'done\';renderTechsPanel()">✅ ۲. تکمیل‌شده دوره (' + fDone.length + ')</button>' +
      '</div>' +
      (curList.length ? curList.map(r => {
        const cust = r.snapshot?.fullName || "مشتری", ph = r.snapshot?.phone || "", isOp = openTechOrdId === r._id;
        return '<div class="drw">' +
          '<div class="drw-h" onclick="openTechOrdId=(openTechOrdId===\'' + r._id + '\'?\'\':\'' + r._id + '\');renderTechsPanel()">' +
            '<div>👤 <b>' + cust + '</b> (' + ph + ') <span class="bdg st-a">👨‍🔧 ' + (r.technicianName || "") + '</span> <span class="bdg st-p">' + (r.invoiceCode || "") + '</span> ' + (r.smsSentAt ? '<span class="bdg st-d">📲 پیامک: ' + r.smsSentAt + '</span>' : '<span class="bdg st-al">📵 پیامک نداده</span>') + '</div>' +
            '<div style="font-size:11px;color:#0f172a">🕒 ' + (r.completedAt ? 'تکمیل: ' + toJ(r.completedAt, true) : 'باز شدن/ارجاع: ' + toJ(r.updatedAt || r.createdAt, true)) + ' ▾</div>' +
          '</div>' +
          '<div class="drw-b ' + (isOp ? 'open' : '') + '">' +
            '<div>📍 <b>آدرس:</b> ' + (r.snapshot?.address || "---") + ' | 📞 <a href="tel:' + ph + '">' + ph + '</a></div>' +
            '<div>🕒 <b>زمان ثبت:</b> ' + toJ(r.createdAt, true) + ' | <b>ساعت باز کردن/عملیات تکنسین:</b> ' + toJ(r.completedAt || r.updatedAt || r.createdAt, true) + '</div>' +
            '<div>🔧 <b>گزارش خدمات و قطعات:</b> ' + (r.workReport || r.issueType || "---") + ' | 💰 <b>مبلغ:</b> ' + fmt(r.payableAmount) + ' ت</div>' +
            (r.customerTicket ? '<div style="color:#be123c;font-weight:bold">🎫 تیکت ثبت‌شده تکنسین: ' + r.customerTicket + '</div>' : '') +
            (r.suspendReason ? '<div style="color:#b45309;font-weight:bold">⏸️ تیکت یادآور / تعلیق: ' + r.suspendReason + ' (' + toJ(r.suspendUntil) + ')</div>' : '') +
            '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">' +
              '<button class="btn" style="background:#16a34a" onclick="sendCustSms(\'' + r._id + '\',\'' + ph + '\',\'' + cust + '\',\'' + (r.technicianName || "") + '\')">📲 ثبت و ارسال پیامک به مشتری</button>' +
              '<a class="btn" style="background:#0284c7;text-decoration:none" href="sms:' + (settings.techMeta?.[r.technicianName]?.phone || "") + '?body=' + encodeURIComponent(`پیگیری سرویس ${cust} (${ph}) - ${r.snapshot?.address || ""}`) + '">📲 پیامک به تکنسین</a>' +
            '</div>' +
          '</div></div>';
      }).join("") : '<div style="font-size:12px;color:#64748b;padding:8px">موردی در این بخش وجود ندارد.</div>') +
    '</div>';
}
function addNewTech() {
  const v = $("newTechInp").value.trim(); if (!v) return;
  if (!techs.includes(v)) { techs.push(v); localStorage.setItem("sw_techs", JSON.stringify(techs)); }
  $("newTechInp").value = ""; renderTechsPanel();
}
function delTech(t) {
  if (!confirm("تکنسین «" + t + "» از لیست فیلتر حذف شود؟")) return;
  techs = techs.filter(x => x !== t); localStorage.setItem("sw_techs", JSON.stringify(techs));
  if (selTechFilter === t) selTechFilter = "ALL";
  renderTechsPanel();
}
// PART 3 END
    function renderSuspPanel() {
  const list = reqs.filter(r => r.status === "suspended"); $("cntSusp").textContent = list.length;
  $("p-susp").innerHTML = '<div class="sec-ttl"><span>⏸️ خدمات تعلیقی تکنسین (' + list.length + ')</span></div>' + (list.length ? list.map(r => '<div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap"><b>👤 ' + (r.snapshot?.fullName || "") + ' (' + (r.snapshot?.phone || "") + ')</b><span class="bdg st-p">تکنسین: ' + (r.technicianName || "---") + ' | موعد: ' + toJ(r.suspendUntil) + '</span></div><div style="font-size:12px;margin:6px 0">⏸️ علت تعلیق و تیکت یادآور: <b>' + (r.suspendReason || "---") + '</b> | 📍 ' + (r.snapshot?.address || "") + '</div><button class="btn" style="background:#16a34a" onclick="assignTech(\'' + r._id + '\',\'' + (r.technicianName || "") + '\')">🔄 بازگردانی به خدمات جاری</button></div>').join("") : '<div class="card">مورد تعلیقی وجود ندارد.</div>');
}

function renderRemPanel() {
  const done = reqs.filter(r => r.status === "done" || r.status === "completed");
  const due = done.filter(r => (180 - Math.round((Date.now() - new Date(r.completedAt || r.createdAt).getTime()) / 86400000)) <= 20);
  $("cntRem").textContent = due.length;
  $("p-rem").innerHTML = '<div class="sec-ttl"><span>🔔 یادآور سرویس دوره‌ای (' + due.length + ')</span></div>' + (due.length ? due.map(r => {
    const days = 180 - Math.round((Date.now() - new Date(r.completedAt || r.createdAt).getTime()) / 86400000);
    return '<div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px"><div><b>👤 ' + (r.snapshot?.fullName || "") + '</b> (' + (r.snapshot?.phone || "") + ') <span class="bdg st-al">' + (days <= 0 ? Math.abs(days) + ' روز گذشته' : days + ' روز مانده') + '</span><div style="font-size:11px;color:#475569;margin-top:4px">📍 ' + (r.snapshot?.address || "") + ' | آخرین سرویس: ' + toJ(r.completedAt) + '</div></div><a class="btn" style="background:#16a34a;text-decoration:none" href="sms:' + (r.snapshot?.phone || "") + '?body=' + encodeURIComponent("مشتری گرامی سامی‌واتر، موعد سرویس ۶ ماهه دستگاه تصفیه آب شما فرا رسیده است.") + '">📲 ارسال پیامک یادآور</a></div>';
  }).join("") : '<div class="card">موردی در موعد یادآوری نیست.</div>');
}

function renderWhPanel() {
  const cStock = (settings.centralStock && settings.centralStock["اصفهان (مرکزی)"]) || {}, tStock = settings.techStock || {}, goods = (settings.catalog || []).filter(c => c.isGoods);
  $("p-wh").innerHTML = '<div class="sec-ttl"><span>🏭 انبار مرکزی و حواله تکنسین‌ها</span></div><div class="grid2"><div class="card"><b>📤 ثبت حواله از انبار مرکزی به تکنسین:</b><select id="whTech" class="inp" style="margin-top:6px">' + techs.map(t => '<option value="' + t + '">' + t + '</option>').join("") + '</select><select id="whItem" class="inp">' + goods.map(g => '<option value="' + g.title + '">' + g.title + ' (موجودی: ' + fmt(cStock[g.title] || 0) + ')</option>').join("") + '</select><input id="whQty" type="number" class="inp" style="direction:ltr" value="1"><button class="btn" style="width:100%" onclick="transferToTech()">📦 ثبت حواله</button></div><div class="card"><b>📊 موجودی کالاها:</b><table><thead><tr><th>کالا</th><th>انبار مرکزی</th><th>نزد تکنسین‌ها</th></tr></thead><tbody>' + goods.map(g => '<tr><td><b>' + g.title + '</b></td><td style="direction:ltr;font-weight:bold;color:#15803d">' + fmt(cStock[g.title] || 0) + '</td><td style="direction:ltr">' + fmt(techs.reduce((s, t) => s + num(tStock[t]?.[g.title]), 0)) + '</td></tr>').join("") + '</tbody></table></div></div>';
}
async function transferToTech() {
  const techName = $("whTech").value, itemTitle = $("whItem").value, qty = num($("whQty").value);
  if (!techName || !itemTitle || qty <= 0) return;
  await fetch(API + "/requests/warehouse-op", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ opType: "central_to_tech", branch: "اصفهان (مرکزی)", techName, itemTitle, qty, byUser: uName }) });
  await loadDash(); alert("✅ حواله ثبت شد.");
}

function renderArchPanel() {
  const done = reqs.filter(r => r.status === "done" || r.status === "completed");
  $("p-arch").innerHTML = '<div class="sec-ttl"><span>📁 بایگانی کل خدمات (' + done.length + ')</span></div><div style="overflow-x:auto"><table><thead><tr><th>فاکتور</th><th>تاریخ و ساعت</th><th>مشتری</th><th>تکنسین</th><th>گزارش کار</th><th>مبلغ</th></tr></thead><tbody>' + done.slice(0, 80).map(r => '<tr><td><b>' + (r.invoiceCode || "") + '</b></td><td>' + toJ(r.completedAt || r.createdAt, true) + '</td><td>' + (r.snapshot?.fullName || "") + ' (' + (r.snapshot?.phone || "") + ')</td><td>' + (r.technicianName || "") + '</td><td>' + (r.workReport || "") + '</td><td style="direction:ltr;font-weight:bold">' + fmt(r.payableAmount) + ' ت</td></tr>').join("") + '</tbody></table></div>';
}

function renderTrashPanel() {
  const tr = reqs.filter(r => r.status === "trashed"); $("cntTr").textContent = tr.length;
  $("p-trash").innerHTML = '<div class="sec-ttl"><span>🗑️ فاکتورهای حذفی (' + tr.length + ')</span></div>' + (tr.map(r => '<div class="card" style="display:flex;justify-content:space-between;align-items:center"><span><b>' + (r.snapshot?.fullName || "") + '</b> (' + (r.invoiceCode || "") + ') — علت حذف: ' + (r.deleteReason || "---") + '</span><button class="btn" onclick="assignTech(\'' + r._id + '\',\'\')">♻️ بازیابی</button></div>').join("") || '<div class="card">فاکتور حذفی وجود ندارد.</div>');
}

function renderCustPanel() {
  const map = {};
  reqs.forEach(r => {
    const ph = normPh(r.snapshot?.phone); if (!ph) return;
    if (!map[ph]) map[ph] = { name: r.snapshot?.fullName || "مشتری", phone: r.snapshot?.phone || ph, addrs: [], orders: [], lastDate: r.completedAt || r.createdAt };
    if (r.snapshot?.address && !map[ph].addrs.includes(r.snapshot.address)) map[ph].addrs.push(r.snapshot.address);
    map[ph].orders.push(r);
  });
  const list = Object.keys(map).map(k => ({ ...map[k], key: k }));
  $("p-cust").innerHTML = '<div class="sec-ttl"><span>👥 بانک اطلاعات مشتریان و تایمر (' + list.length + ' مشتری)</span></div>' +
    list.map(c => {
      const days = 180 - Math.round((Date.now() - new Date(c.lastDate).getTime()) / 86400000);
      const isOp = openCustPh === c.key;
      return '<div class="drw"><div class="drw-h" onclick="openCustPh=(openCustPh===\'' + c.key + '\'?\'\':\'' + c.key + '\');renderCustPanel()"><span>👤 <b>' + c.name + '</b> (' + c.phone + ') — ' + c.orders.length + ' سابقه</span><span class="bdg ' + (days <= 20 ? 'st-al' : 'st-d') + '">⏱️ تایمر: ' + days + ' روز ▾</span></div><div class="drw-b ' + (isOp ? 'open' : '') + '"><div>🏠 <b>تمام آدرس‌ها:</b> ' + c.addrs.join(" | ") + '</div><div>📜 <b>سوابق سرویس:</b>' + c.orders.map(o => '<div>• ' + toJ(o.completedAt || o.createdAt, true) + ' (' + (o.invoiceCode || "") + ' - ' + (o.technicianName || "---") + '): ' + (o.workReport || o.issueType || "") + ' — ' + fmt(o.payableAmount) + ' ت</div>').join("") + '</div></div></div>';
    }).join("");
}

function renderCatPanel() {
  const cat = settings.catalog || [];
  $("p-cat").innerHTML = '<div class="sec-ttl"><span>🏷️ تعرفه کالا و دستمزد تکنسین</span></div><div class="card"><div class="grid2"><div><input id="cTit" class="inp" placeholder="نام کالا یا خدمت *"><input id="cBuy" type="number" class="inp" style="direction:ltr" placeholder="قیمت خرید شرکت (تومان)"></div><div><input id="cPr" type="number" class="inp" style="direction:ltr" placeholder="قیمت فروش به مشتری (تومان) *"><div style="display:flex;gap:6px"><input id="cWg" type="number" class="inp" style="margin:0;direction:ltr;flex:2" placeholder="دستمزد تکنسین *"><select id="cGd" class="inp" style="margin:0;flex:1"><option value="1">📦 کالا</option><option value="0">🔧 خدمات</option></select></div></div></div><button class="btn" style="width:100%;background:#16a34a;margin-top:6px" onclick="addCatItem()">➕ افزودن به تعرفه</button><table><thead><tr><th>شرح</th><th>نوع</th><th>فی خرید</th><th>فروش</th><th>دستمزد</th><th>حذف</th></tr></thead><tbody>' + cat.map((c, i) => '<tr><td><b>' + c.title + '</b></td><td>' + (c.isGoods ? '📦 کالا' : '🔧 خدمت') + '</td><td style="direction:ltr">' + fmt(c.buyPrice || 0) + '</td><td style="direction:ltr"><b>' + fmt(c.customerPrice) + '</b></td><td style="direction:ltr">' + fmt(c.techWage) + '</td><td><button class="btn" style="background:#ef4444;padding:3px 7px" onclick="delCat(' + i + ')">×</button></td></tr>').join("") + '</tbody></table></div>';
}
async function addCatItem() {
  const title = $("cTit").value.trim(), buyPrice = num($("cBuy").value), customerPrice = num($("cPr").value), techWage = num($("cWg").value), isGoods = $("cGd").value === "1";
  if (!title || customerPrice <= 0) return;
  const cat = (settings.catalog || []).filter(c => c.title !== title); cat.push({ title, buyPrice, customerPrice, techWage, isGoods });
  await fetch(API + "/requests/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ catalog: cat }) }); await loadDash();
}
async function delCat(i) { const cat = settings.catalog || []; cat.splice(i, 1); await fetch(API + "/requests/settings", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ catalog: cat }) }); await loadDash(); }

loadDash();
</script>
</body>
</html>
